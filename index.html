e-columns:repeat(2,1fr)}@media(max-width:540px){.flow{grid-template-columns:1fr 1fr}.course-row{grid-template-columns:32px 1fr;gap:14px}.course-row h2{font-size:23px}.course-row .index{font-size:25px}.cards.two{grid-template-columns:1fr}.builder{padding:18px}.toplinks{gap:11px}.toplinks .reference{display:none}.brand{font-size:16px}.lesson h1{font-size:34px}.sample-response{padding:18px}.table-wrap{margin-right:0}.keyline{font-size:22px}}</style></head><body><a href="#main" class="skip">跳到正文</a><header><a class="brand" href="#framework">模数 · 学习室<em>WORKING WITH AI</em></a><div class="toplinks"><a href="#framework" class="reference">课程框架</a><a class="pill" href="#assessment">独立自测 ↗</a><button class="menu" id="menu" aria-controls="sidebar" aria-expanded="false">目录</button></div></header><div id="storageNotice" class="storage-notice hidden" role="status">当前环境无法长期保存记录；仍可学习和自测。关闭前请导出笔记。</div><div class="layout"><aside id="sidebar"><div class="eyebrow">全员必修 / Course 00</div><div class="side-title">第一课 · AI办公入门</div><nav class="nav" aria-label="课程目录"><a href="lesson01.html#home"><span class="num">→</span>第二课 · 数据安全与结果核验</a><a href="#framework" data-nav="framework"><span class="num">↗</span>全部课程框架</a><a href="#home" data-nav="home"><span class="num">○</span>第一课导览</a><a href="#lesson1" data-nav="lesson1"><span class="num">01</span>五分钟写出周报<span class="done" data-done="1"></span></a><a href="#lesson2" data-nav="lesson2"><span class="num">02</span>理解 AI 的能力<span class="done" data-done="2"></span></a><a href="#lesson3" data-nav="lesson3"><span class="num">03</span>选择任务与工具<span class="done" data-done="3"></span></a><a href="#lesson4" data-nav="lesson4"><span class="num">04</span>把要求说清楚<span class="done" data-done="4"></span></a><a href="#lesson5" data-nav="lesson5"><span class="num">05</span>追问与修改<span class="done" data-done="5"></span></a><a href="#lesson6" data-nav="lesson6"><span class="num">06</span>检查后再使用<span class="done" data-done="6"></span></a><a href="#lesson7" data-nav="lesson7"><span class="num">07</span>五个办公例子<span class="done" data-done="7"></span></a><a href="#lesson8" data-nav="lesson8"><span class="num">08</span>独立练习<span class="done" data-done="8"></span></a></nav><div class="progress-box"><div class="caption" id="progressLabel">已学习 0 / 8 个单元</div><progress id="progress" max="8" value="0" aria-label="自行标记的学习进度"></progress><p>勾选记录学习进度，<br>知识自测与实操单独判断。</p></div><div class="sidefoot"><button class="textbtn" data-export="notes">导出本课笔记</button><a href="#sources" data-nav="sources">教学参考与说明</a><button class="textbtn" id="reset">清除本课本机记录</button></div></aside><main id="main" tabindex="-1"></main></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div><noscript><p style="padding:30px">请启用浏览器JavaScript以使用课程目录和学习交互。</p></noscript><script>const DATA={"lessons": [{"title": "先让 AI 帮你写一份周报。", "short": "五分钟写出周报", "time": "5 分钟", "desc": "从这周的随手记录开始，整理一份负责人看得懂的周报。", "body": "<p>周五快下班了，你要给负责人发一份周报。事情做了不少，但记录散在便签和聊天里。你希望对方一眼看清：这周做了什么，还有什么没做完，下周准备做什么。<\/p><p class=\"smalltext\">本课人物和材料均为模拟，用来练习日常办公；示范回答由课程作者编写。你可以用团队允许使用的任意AI对话工具跟做。<\/p><div class=\"example\"><span class=\"label\">你手头只有这些记录<\/span><pre>这周的工作随手记\n周一：把上周活动的报名名单整理好了，重复报名的也合并了。\n周二：回了8位用户的问题，其中2位问能不能看回放。我去问了负责视频的同事，还没收到回复。\n周三：下周活动的通知写完了，发给负责人看了，还没确认，暂时没发到群里。\n周四：报名表加上了“公司”和“职位”两项，自己试填了一次，没发现问题。\n周五：活动海报还差一张嘉宾照片，已经找设计同事要了，暂时没拿到。\n下周：发活动通知、确认回放怎么安排、做完海报。<\/pre><button class=\"btn secondary small\" data-download=\"demo\">下载这周的工作记录<\/button><\/div><h2>你可以直接这样说<\/h2><p>打开一个新对话，复制下面整段话。记录已经附在里面，不用再下载文件。<\/p><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可复制提示词<\/span><button class=\"copy\" data-copy=\"p1\">复制<\/button><\/div><pre id=\"p1\">帮我把这周的工作记录整理成一份发给负责人的周报。按“这周做了什么、还有什么没完成、下周要做什么”分成三部分，写得简短一点，像平时跟同事汇报就行。还没完成的事别写成已经完成。\n\n这是我的记录：\n这周的工作随手记\n周一：把上周活动的报名名单整理好了，重复报名的也合并了。\n周二：回了8位用户的问题，其中2位问能不能看回放。我去问了负责视频的同事，还没收到回复。\n周三：下周活动的通知写完了，发给负责人看了，还没确认，暂时没发到群里。\n周四：报名表加上了“公司”和“职位”两项，自己试填了一次，没发现问题。\n周五：活动海报还差一张嘉宾照片，已经找设计同事要了，暂时没拿到。\n下周：发活动通知、确认回放怎么安排、做完海报。<\/pre><\/div><div class=\"sample-response\"><span class=\"label\">整理后，可以是这样<\/span><p><b>这周做了什么<\/b><br>整理了上周活动的报名名单，合并了重复报名；回复了8位用户的问题。报名表已加上“公司”和“职位”，自己试填了一次，没发现问题。<\/p><p><b>还有什么没完成<\/b><br>活动通知已写好，等负责人确认后再发。2位用户问的回放还没得到答复。海报还缺嘉宾照片，已找设计同事要。<\/p><p><b>下周要做什么<\/b><br>跟进活动通知确认并发布；问清回放安排后回复用户；拿到照片后完成海报。<\/p><\/div><h2>先检查三件事<\/h2><div class=\"instruction\"><span class=\"step\">1<\/span><div><h3>8位用户的问题都解决了吗？<\/h3><p>只知道你回复了8位用户。回放的问题还在等答复，不能写“全部解决”。<\/p><\/div><\/div><div class=\"instruction\"><span class=\"step\">2<\/span><div><h3>活动通知发出去了吗？<\/h3><p>记录只说发给负责人看，还没有发到群里。<\/p><\/div><\/div><div class=\"instruction\"><span class=\"step\">3<\/span><div><h3>海报完成了吗？<\/h3><p>照片还没拿到，当然不能写“海报已完成”。<\/p><\/div><\/div><h2>觉得太正式，就接着说<\/h2><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可复制提示词<\/span><button class=\"copy\" data-copy=\"p2\">复制<\/button><\/div><pre id=\"p2\">这份是发在工作群里的，不用写得像正式报告。帮我再缩短一点，保留还没完成的事。<\/pre><\/div><p>AI给你的措辞可能不同。事实没变、重点清楚、你愿意直接拿去用，就算这次练习做成了。<\/p><div class=\"notearea\"><label class=\"field\" for=\"first\">留一下你的第一份周报<\/label><textarea id=\"first\" data-note=\"first\" placeholder=\"贴上你觉得可以用的版本，或记下保存位置。\"><\/textarea><div class=\"savehint\">本机笔记 · 不自动提交；可随时从目录导出。<\/div><\/div><p class=\"source\">方法参考：OpenAI Academy · 从第一次对话开始，用追问改进结果。 · <a href=\"#sources\">查看原始资料与改编说明 →<\/a><\/p>"}, {"title": "AI 能帮什么，又会在哪里出错？", "short": "理解 AI 的能力", "time": "6 分钟", "desc": "分清写得像、说得对和真的做了，少走几次返工。", "body": "<p>你刚才做了两件事：把材料交给AI，再告诉它希望得到什么。它根据这些信息组织出一份回答。这很适合整理、改写、比较和起草。<\/p><p>但AI也可能为了让一段话更完整，补上材料里没有的东西。例如，把“等回复”写成“已经解决”。这种没有依据或错误的生成，常被叫作“幻觉”。<\/p><h2>看懂这三个区别，就够开始用了<\/h2><div class=\"table-wrap\" role=\"region\" aria-label=\"教学对照表，可横向滚动\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>它给了什么<\/th><th>实际说明什么<\/th><th>你怎么判断<\/th><\/tr><\/thead><tbody><tr><td>一份通顺的周报<\/td><td>文字组织得不错<\/td><td>对照记录，看有没有改错事实<\/td><\/tr><tr><td>“报名表已测试通过”<\/td><td>它可能把你的一次试填夸大了<\/td><td>只保留“自己试填了一次，没发现问题”<\/td><\/tr><tr><td>“已帮你发到工作群”<\/td><td>单凭这句话，无法证明已发送<\/td><td>只有使用发送工具且有成功记录，才算真的做了<\/td><\/tr><\/tbody><\/table><\/div><h2>几个常见词，用人话讲<\/h2><div class=\"table-wrap\" role=\"region\" aria-label=\"教学对照表，可横向滚动\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>你可能听到的词<\/th><th>它在这次练习里是什么<\/th><\/tr><\/thead><tbody><tr><td>提示词<\/td><td>你发给AI的那段话，不需要特殊句式<\/td><\/tr><tr><td>上下文<\/td><td>这周的记录，以及你前面说过的要求<\/td><\/tr><tr><td>模型<\/td><td>工具背后理解和生成内容的核心能力<\/td><\/tr><tr><td>工具<\/td><td>让AI读取文件、查网页、计算或操作应用的能力<\/td><\/tr><tr><td>Agent<\/td><td>能够围绕目标，使用工具继续做多个步骤的AI系统；具体能做什么要看配置与权限<\/td><\/tr><\/tbody><\/table><\/div><h2>它不一定看得到你看到的内容<\/h2><p>你把一个飞书链接贴给AI，它未必能打开。它说“已了解”也不算读过。可以让它指出原文里的关键句，再打开原文核对。读不到时，在允许的范围内把相关内容贴过去。<\/p><p>同样，新开一个对话，它不一定记得上次的要求；对话太长，也可能漏掉前面的信息。重要的时间、数字和最新安排，最好重新提供。<\/p><details><summary>再了解一点：更强的模型、更长的上下文有什么用？<\/summary><p>更强的推理能力适合比较复杂方案；更长的上下文可以容纳更多材料。但错误的材料、缺少的权限和含糊的目标，仍然会影响结果。先把任务和材料说明白，再考虑是否需要换工具。<\/p><p>检查答案时，可以请AI说明依据、假设和计算步骤。无需让它展示完整的内部思考过程。<\/p><\/details><div class=\"notearea\"><label class=\"field\" for=\"mental\">刚才的周报，哪一句最值得你检查？<\/label><textarea id=\"mental\" data-note=\"mental\" placeholder=\"例如：它有没有把“回复用户”写成“解决问题”？\"><\/textarea><div class=\"savehint\">本机笔记 · 不自动提交；可随时从目录导出。<\/div><\/div><p class=\"source\">方法参考：Anthropic AI Fluency · 生成式AI的能力与局限；OpenAI Academy · Fundamentals。 · <a href=\"#sources\">查看原始资料与改编说明 →<\/a><\/p>"}, {"title": "选一件你今天就用得上的事。", "short": "选择任务与工具", "time": "6 分钟", "desc": "先从有材料、结果好检查的小事开始。", "body": "<p>第一次用AI办公，不必先设计复杂流程。想想你今天有没有一件事：要重新组织一段文字，要从一堆记录里找出重点，或要把重复信息汇总一下。<\/p><h2>这几件事，就很适合开始<\/h2><div class=\"table-wrap\" role=\"region\" aria-label=\"教学对照表，可横向滚动\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>手头的工作<\/th><th>可以先请AI做什么<\/th><th>你需要补的判断<\/th><\/tr><\/thead><tbody><tr><td>一周的零散记录<\/td><td>整理成简短周报<\/td><td>哪些事情最重要，有没有把进度写错<\/td><\/tr><tr><td>一封不好开口的催办消息<\/td><td>写两个不同语气的版本<\/td><td>哪个更符合你和对方的关系<\/td><\/tr><tr><td>一段会议聊天<\/td><td>列出谁做什么、什么时候交<\/td><td>谁已答应，哪些还只是建议<\/td><\/tr><tr><td>一张报名表<\/td><td>按规则整理人数和名单<\/td><td>重复报名、取消记录怎样算<\/td><\/tr><tr><td>两个供应商的方案<\/td><td>比较价格、包含的服务和差异<\/td><td>预算、质量和交付风险怎么取舍<\/td><\/tr><\/tbody><\/table><\/div><h2>回到这份周报：哪些让 AI 做，哪些由你决定？<\/h2><p>AI可以整理记录、缩短文字、找出前后矛盾。你需要判断哪些信息值得让负责人知道；要不要请求支持；最后以什么口吻发出。<\/p><p>比如海报迟迟没完成，AI可以指出它卡在照片上。要不要催设计、向谁求助、是否调整活动安排，需要结合实际情况决定。<\/p><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可复制提示词<\/span><button class=\"copy\" data-copy=\"p3\">复制<\/button><\/div><pre id=\"p3\">这周事情有点多，我想写一份简短周报。你先帮我把下面的记录分分类，看看还有哪些事情没收尾。如果有什么地方没写清楚，提醒我一下。\n\n[把你的工作记录贴在这里]<\/pre><\/div><h2>什么时候才需要换一种工具？<\/h2><div class=\"table-wrap\" role=\"region\" aria-label=\"教学对照表，可横向滚动\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>需求<\/th><th>更合适的能力<\/th><th>简单检查<\/th><\/tr><\/thead><tbody><tr><td>把一段话改得顺一点<\/td><td>普通对话<\/td><td>读一遍，事实和语气是否合适<\/td><\/tr><tr><td>查今天的报名截止时间<\/td><td>联网检索或活动官方页面<\/td><td>打开来源，看日期和适用活动<\/td><\/tr><tr><td>处理几千行报名数据<\/td><td>电子表格公式或代码计算<\/td><td>抽查重复、取消和空白记录<\/td><\/tr><tr><td>读取截图、扫描件<\/td><td>图片理解或文字识别<\/td><td>放大核对日期、金额等关键位置<\/td><\/tr><tr><td>读取多份资料并更新文档<\/td><td>有相应权限的Agent与工具<\/td><td>查看它实际读了什么、改了哪里<\/td><\/tr><\/tbody><\/table><\/div><p>本课先把对话用好。后续课程再逐步学习飞书、Team Agent和工作流，不要求一次装齐所有工具。<\/p><div class=\"notearea\"><label class=\"field\" for=\"delegate\">写下一件你今天就想交给 AI 的小事<\/label><textarea id=\"delegate\" data-note=\"delegate\" placeholder=\"我手头有什么材料？\n我希望它先帮我做什么？\n哪一步还需要我决定？\"><\/textarea><div class=\"savehint\">本机笔记 · 不自动提交；可随时从目录导出。<\/div><\/div><p class=\"source\">方法参考：Anthropic AI Fluency · Delegation：按任务目标决定分工。 · <a href=\"#sources\">查看原始资料与改编说明 →<\/a><\/p>"}, {"title": "不用背公式，像交代同事一样说。", "short": "把要求说清楚", "time": "7 分钟", "desc": "先说要干什么，再给材料；有具体偏好就补一句。", "body": "<p>提示词就是你给AI的工作要求。日常任务不需要写成技术文档，也不必先说“你是世界顶级专家”。先用一句正常的话，把你想要的结果讲出来。<\/p><div class=\"compare\"><div class=\"example\"><span class=\"label\">信息太少<\/span><p>“帮我优化一下。”<\/p><p class=\"smalltext\">它不知道你嫌长、嫌正式，还是觉得重点不清。<\/p><\/div><div class=\"example\"><span class=\"label\">同事能听懂的说法<\/span><p>“这段周报太长了，帮我缩短一些，负责人看一眼就能知道进度。没做完的事要留下。”<\/p><p class=\"smalltext\">不用复杂措辞，也能让它知道怎么改。<\/p><\/div><\/div><h2>常用的三句话<\/h2><div class=\"table-wrap\" role=\"region\" aria-label=\"教学对照表，可横向滚动\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>想清楚什么<\/th><th>可以怎么说<\/th><\/tr><\/thead><tbody><tr><td>帮我做什么<\/td><td>把这些记录整理成周报。<\/td><\/tr><tr><td>做给谁看、在哪里用<\/td><td>发在工作群，给负责人看。<\/td><\/tr><tr><td>我有什么具体要求<\/td><td>短一点，别用套话，没做完的事别写成完成。<\/td><\/tr><\/tbody><\/table><\/div><p>然后贴上材料。简单任务说到这里就可以开始；格式、字数或禁忌真的重要，再补充。无需每次把所有要求都写一遍。<\/p><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可复制提示词<\/span><button class=\"copy\" data-copy=\"p4\">复制<\/button><\/div><pre id=\"p4\">下面这段话我要发给同事，但现在读起来有点生硬。帮我改得自然一点，意思别变，保留最后的截止时间。给我一个可以直接用的版本就行。\n\n[贴上要修改的原文]<\/pre><\/div><h2>给一小段例子，比说“高级一点”更清楚<\/h2><p>如果你想要固定语气，可以给一句自己愿意使用的话。例如：“这周主要做了三件事，海报还在等照片，我下周继续跟进。”接着告诉AI：“就按这种口吻写，别加‘赋能’‘闭环’之类的词。”<\/p><h2>信息少时，可以边聊边补<\/h2><p>你不确定周报该写什么，可以先说：“我要写周报，但记录有点乱。你先问我几个必要的问题，帮我把事情理清楚。”不需要第一句话就完美。<\/p><h2>试着写一句你自己的要求<\/h2><p>下面只是帮你理顺想法。填有用的几项就好，没用到的可以留空。<\/p><div class=\"builder\"><div class=\"notearea\"><label class=\"field\" for=\"b-goal\">想请 AI 帮什么忙？<\/label><textarea id=\"b-goal\" data-note=\"b-goal\" placeholder=\"例如：把这周的记录写成周报\"><\/textarea><div class=\"savehint\">本机笔记 · 不自动提交；可随时从目录导出。<\/div><\/div><div class=\"notearea\"><label class=\"field\" for=\"b-material\">你会提供什么材料？<\/label><textarea id=\"b-material\" data-note=\"b-material\" placeholder=\"把记录贴在这里\"><\/textarea><div class=\"savehint\">本机笔记 · 不自动提交；可随时从目录导出。<\/div><\/div><div class=\"notearea\"><label class=\"field\" for=\"b-output\">这份内容给谁看，怎么用？<\/label><textarea id=\"b-output\" data-note=\"b-output\" placeholder=\"例如：发工作群，给负责人看\"><\/textarea><div class=\"savehint\">本机笔记 · 不自动提交；可随时从目录导出。<\/div><\/div><div class=\"notearea\"><label class=\"field\" for=\"b-boundary\">有什么需要特别注意的？<\/label><textarea id=\"b-boundary\" data-note=\"b-boundary\" placeholder=\"例如：没完成的事别写成完成\"><\/textarea><div class=\"savehint\">本机笔记 · 不自动提交；可随时从目录导出。<\/div><\/div><div class=\"notearea\"><label class=\"field\" for=\"b-quality\">你希望它写成什么样？<\/label><textarea id=\"b-quality\" data-note=\"b-quality\" placeholder=\"例如：简短自然，不要套话\"><\/textarea><div class=\"savehint\">本机笔记 · 不自动提交；可随时从目录导出。<\/div><\/div><button class=\"btn small\" id=\"buildPrompt\">整理成一段话<\/button><div id=\"builtPrompt\"><\/div><\/div><details><summary>经常做同一类任务，怎样少说几遍？<\/summary><p>把稳定的要求保存为模板，例如周报的读者、长度和栏目。如果工具支持项目资料或自定义指令，也可以在那里保存。每周的记录和最新进度仍要更新；不要把上周的事实当成这周的情况。<\/p><\/details><p class=\"source\">方法参考：OpenAI Academy · Prompting 与 Customizing ChatGPT；Anthropic · Description。 · <a href=\"#sources\">查看原始资料与改编说明 →<\/a><\/p>"}, {"title": "第一稿不合适，就具体告诉它怎么改。", "short": "追问与修改", "time": "6 分钟", "desc": "指出哪句话有问题，再说你想怎么改。", "body": "<h2>假如 AI 写成了这样<\/h2><div class=\"example\"><span class=\"label\">需要修改的草稿<\/span><p>“本周全面完成活动筹备工作，解决8位用户的问题，活动通知和海报均已准备就绪。”<\/p><\/div><p>看起来很完整，但和你的记录对不上：回放还没答复，通知还没确认，海报还缺照片。先把事实改对，再考虑文字好不好看。<\/p><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可复制提示词<\/span><button class=\"copy\" data-copy=\"p5\">复制<\/button><\/div><pre id=\"p5\">这里写得太满了。8位用户的问题我都回复过，但回放还没问清楚；通知在等负责人确认，海报还缺照片。请按这些实际进度重写，别用“全面完成”“准备就绪”这样的说法。<\/pre><\/div><div class=\"sample-response\"><span class=\"label\">修改后<\/span><p>本周回复了8位用户的问题，其中2位问的回放还在等答复。活动通知已写好，待负责人确认；海报还缺嘉宾照片，正在跟进。<\/p><\/div><h2>只是不喜欢语气，也可以直接说<\/h2><div class=\"table-wrap\" role=\"region\" aria-label=\"教学对照表，可横向滚动\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>你的感觉<\/th><th>可以接着说<\/th><\/tr><\/thead><tbody><tr><td>太正式<\/td><td>像平时在群里说话那样写，不用“本周围绕……开展工作”。<\/td><\/tr><tr><td>太长<\/td><td>压缩到三条，每条一两句话。<\/td><\/tr><tr><td>没重点<\/td><td>负责人最关心活动能不能按时准备好，把还没完成的事放前面。<\/td><\/tr><tr><td>改丢了重要信息<\/td><td>“还有2位用户等回放答复”要保留，其他内容可以再短一点。<\/td><\/tr><\/tbody><\/table><\/div><h2>如果实际进度变了呢？<\/h2><div class=\"example\"><span class=\"label\">你刚收到的新消息<\/span><pre>刚收到两个新消息：\n负责人已经确认活动通知可以用了，不过要等海报做好，再一起发到群里。\n嘉宾照片拿到了，已经转给设计同事，海报还没做完。<\/pre><button class=\"btn secondary small\" data-download=\"change\">下载这两条新消息<\/button><\/div><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可复制提示词<\/span><button class=\"copy\" data-copy=\"p6\">复制<\/button><\/div><pre id=\"p6\">更新一下：负责人已经确认通知可以用了，但要等海报做好再一起发。嘉宾照片也拿到了，已经转给设计，海报还没完成。帮我把周报里这两处改一下，其他内容不变。<\/pre><\/div><div class=\"sample-response\"><span class=\"label\">这两处应该变成<\/span><p>活动通知已确认，等海报做好后一起发布。嘉宾照片已交给设计，海报仍在制作中。<\/p><\/div><p>注意：通知“已确认”不等于“已发布”；照片“已拿到”也不等于海报“已完成”。回放没有新消息，仍然写在等待答复的事情里。<\/p><details><summary>对话太长，或要换一个对话继续怎么办？<\/summary><p>带上最新稿，再用几句话说明：你正在做什么、哪些进度刚变了、哪些要求仍要保留。重要事实最好附上原始记录。这样可以减少新对话沿用旧进度的情况。<\/p><\/details><div class=\"notearea\"><label class=\"field\" for=\"iteration\">记下一次你做过的修改<\/label><textarea id=\"iteration\" data-note=\"iteration\" placeholder=\"AI原来写了什么？\n你为什么不满意？\n你怎么让它改的？\"><\/textarea><div class=\"savehint\">本机笔记 · 不自动提交；可随时从目录导出。<\/div><\/div><p class=\"source\">方法参考：OpenAI Academy · 具体反馈与迭代；Anthropic · 表达和判断循环。 · <a href=\"#sources\">查看原始资料与改编说明 →<\/a><\/p>"}, {"title": "发出去前，花一分钟检查。", "short": "检查后再使用", "time": "5 分钟", "desc": "重点看人名、数字、时间和进度，不只看文字顺不顺。", "body": "<p>周报读起来顺了，还需要和原始记录对照一次。AI可以帮你找问题，但重要信息仍需要你确认。<\/p><h2>拿这份周报检查一遍<\/h2><div class=\"table-wrap\" role=\"region\" aria-label=\"教学对照表，可横向滚动\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>检查什么<\/th><th>本例要看哪一处<\/th><\/tr><\/thead><tbody><tr><td>数字有没有变<\/td><td>回复了8位用户，其中2位问回放；别写成8位都问回放。<\/td><\/tr><tr><td>进度有没有写过头<\/td><td>通知已经确认但没发布；照片拿到但海报没做完。<\/td><\/tr><tr><td>还没解决的事有没有丢<\/td><td>回放仍在等答复，不能因为有了新消息就从周报里消失。<\/td><\/tr><tr><td>有没有加上你没答应的事<\/td><td>材料没说周一一定发布，就不能替你承诺。<\/td><\/tr><\/tbody><\/table><\/div><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可复制提示词<\/span><button class=\"copy\" data-copy=\"p7\">复制<\/button><\/div><pre id=\"p7\">帮我把这份周报和前面的工作记录对照一下，看看有没有数字写错、漏掉没完成的事，或者把进度写得太满的地方。有问题就指出具体哪一句。<\/pre><\/div><p>它说“没问题”后，你仍要亲自看一眼关键项。AI可能检查不出来自己刚才犯的错。<\/p><h2>保存、交给别人，也可以很简单<\/h2><p>确认内容后，保存为“本周周报”，再按你的实际工作方式发出。只起草了文字时，别把“写好了”说成“已经发了”。如果另存了修改稿，文件名里加上日期，避免发错旧版。<\/p><div class=\"example\"><span class=\"label\">给负责人附一句就够了<\/span><p>“这是本周周报。通知已经确认，等海报做好再一起发；回放还在等答复，我下周继续跟进。”<\/p><\/div><div class=\"checklist\"><label><input type=\"checkbox\" data-check=\"0\">数字和人名对过原记录了。<\/label><label><input type=\"checkbox\" data-check=\"1\">完成和没完成的事情分清楚了。<\/label><label><input type=\"checkbox\" data-check=\"2\">没有添上我没答应的时间或安排。<\/label><label><input type=\"checkbox\" data-check=\"3\">保存的是修改后的这一版。<\/label><\/div><h2>换成真实工作时，多留意两件事<\/h2><p>只把允许使用的材料交给AI，不必为了写周报上传整份客户资料。如果它读不到文件，或看不清截图，就补充相关原文，别让它靠猜。下一课会专门练习资料使用和结果核查。<\/p><div class=\"notearea\"><label class=\"field\" for=\"handoff\">这份周报最后检查了什么？<\/label><textarea id=\"handoff\" data-note=\"handoff\" placeholder=\"写下一处你亲自对照过的事实，以及最终稿保存在哪里。\"><\/textarea><div class=\"savehint\">本机笔记 · 不自动提交；可随时从目录导出。<\/div><\/div><p class=\"source\">方法参考：Anthropic AI Fluency · Discernment / Diligence：判断质量并对使用结果负责。 · <a href=\"#sources\">查看原始资料与改编说明 →<\/a><\/p>"}, {"title": "再试试这五件日常小事。", "short": "五个办公例子", "time": "选学 · 8–12 分钟", "desc": "每个例子都给出原话、可以怎么问，以及结果该是什么样。", "body": "<p>挑一个你用得上的例子即可。带方括号的内容，换成自己的实际材料再发送。<\/p><details><summary>一、催同事给材料，怎样不显得生硬？<\/summary><div class=\"example\"><span class=\"label\">事情是这样的<\/span><p>你今天要把活动海报交给负责人看，但还没收到嘉宾照片。昨天已经问过设计同事。<\/p><\/div><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可复制提示词<\/span><button class=\"copy\" data-copy=\"s1\">复制<\/button><\/div><pre id=\"s1\">我今天要把活动海报交给负责人看，还差嘉宾照片。昨天已经问过设计同事了，帮我写一句微信再问问进度，客气一点，但要让对方知道我今天要用。<\/pre><\/div><div class=\"sample-response\"><span class=\"label\">可以这样写<\/span><p>想再跟你确认一下，嘉宾照片今天方便给我吗？我今天要把海报交给负责人看，还差这张图。要是暂时拿不到，也跟我说一下，我好提前调整。<\/p><\/div><p>检查：表达了你今天要用，但没有擅自要求对方“下午3点前必须交”。<\/p><\/details><details><summary>二、把一段长说明，整理成新人看得懂的几条<\/summary><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可复制提示词<\/span><button class=\"copy\" data-copy=\"s2\">复制<\/button><\/div><pre id=\"s2\">帮我把下面的报销说明整理成几条，给第一次报销的同事看。写清楚要准备什么、什么时候交、超过时间怎么办。\n\n报销需要发票和付款截图，每周四下午5点前提交给财务。当周审核通过的，周五付款；超过提交时间的放到下周处理。单笔超过1000元的，还要附负责人确认记录。<\/pre><\/div><div class=\"sample-response\"><span class=\"label\">整理后<\/span><p>①准备发票和付款截图；单笔超过1000元，再附负责人确认记录。<br>②周四下午5点前交给财务。<br>③当周审核通过后，周五付款；晚交的下周处理。<\/p><\/div><p>检查：“交了就周五付款”不准确，还要审核通过。这里是模拟规则，真实报销以公司制度为准。<\/p><\/details><details><summary>三、报名记录有重复，最后到底来了几个人？<\/summary><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可复制提示词<\/span><button class=\"copy\" data-copy=\"s3\">复制<\/button><\/div><pre id=\"s3\">帮我看看最后有几个人报名。下面是按先后顺序记的，同一个人出现多次就看最后一次，取消的不要算进去。练习里的名字分别对应不同的人。\n\n小林：报名\n阿宁：报名\n小林：又填了一次报名\n小周：取消\n小陈：报名\n阿宁：取消\n\n先列出每个人最后的情况，再告诉我人数。<\/pre><\/div><div class=\"table-wrap\" role=\"region\" aria-label=\"教学对照表，可横向滚动\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>人<\/th><th>最后情况<\/th><\/tr><\/thead><tbody><tr><td>小林<\/td><td>报名（重复填写只算一次）<\/td><\/tr><tr><td>阿宁<\/td><td>取消<\/td><\/tr><tr><td>小周<\/td><td>取消<\/td><\/tr><tr><td>小陈<\/td><td>报名<\/td><\/tr><\/tbody><\/table><\/div><p><b>最后报名2人：小林、小陈。<\/b>不能直接数记录条数。真实表格里可能重名，建议用成员编号等可靠标识区分；大量数据用公式或代码处理，并抽查几条。<\/p><\/details><details><summary>四、看不懂文档里的词，先让它举个例子<\/summary><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可复制提示词<\/span><button class=\"copy\" data-copy=\"s4\">复制<\/button><\/div><pre id=\"s4\">我第一次接触“转化率”，没太看懂。请用活动报名举个简单例子，说明怎么算，再说说这个数字容易被误解在哪里。<\/pre><\/div><div class=\"sample-response\"><span class=\"label\">一个容易理解的解释<\/span><p>如果100个不同的人打开报名页，其中20人报名，按这个定义，报名转化率就是20÷100＝20%。<\/p><p>要先说清分母是“打开页面的人”还是“收到邀请的人”。定义不同，数字不能直接比较。页面浏览次数也不等于人数。<\/p><\/div><p>再追问一句：“如果同一个人打开了三次，应该怎么数？”能帮助你确认自己真的理解了。涉及最新政策、价格或截止时间，还需要查当前可靠来源。<\/p><\/details><details><summary>五、把截图里的日程整理成文字<\/summary><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可复制提示词<\/span><button class=\"copy\" data-copy=\"s5\">复制<\/button><\/div><pre id=\"s5\">帮我把这张日程截图整理成表格，列出时间、事情和地点。看不清的地方先标出来，我来补，别猜。<\/pre><\/div><p>这条指令需要你另附一张允许使用的、清晰的日程截图，本课没有内置截图素材。<\/p><p><b>结果应该像这样：<\/b>每个日程一行；看不清的时间写“看不清，需确认”，而非补出一个时间。整理后对着图片检查每一项日期和时间。<\/p><\/details><div class=\"notearea\"><label class=\"field\" for=\"transfer\">把一个例子换成你自己的工作<\/label><textarea id=\"transfer\" data-note=\"transfer\" placeholder=\"我遇到了什么事？\n我会怎么跟AI说？\n结果里哪一点需要我检查？\"><\/textarea><div class=\"savehint\">本机笔记 · 不自动提交；可随时从目录导出。<\/div><\/div><p class=\"source\">方法参考：OpenAI Academy · 日常工作与提示方法；本页情境和数据为原创模拟。 · <a href=\"#sources\">查看原始资料与改编说明 →<\/a><\/p>"}, {"title": "换一件事，自己试一次。", "short": "独立练习", "time": "15–20 分钟", "desc": "把项目群里的几条消息，整理成一份准备清单。", "body": "<p>这次不用再写周报。你要帮同事准备一场客户演示，群里已经说了时间和分工，但散在几条消息里。小周希望你整理一下，方便大家对照着准备。<\/p><p class=\"smalltext\">下面是模拟对话，人物与业务均为虚构。直接用这份材料就能练习，不需要知道任何公司背景。<\/p><div class=\"example\"><span class=\"label\">先看看群里说了什么<\/span><pre>项目群里的几条消息\n小周：下周三下午3点给客户演示新版产品，留一个小时。客户最想看报名和签到两个功能。\n小林：演示用的账号我来准备，周二下班前给你。\n阿宁：我把操作流程做成几页介绍，周二中午前发群里。\n小周：好，我来演示。线上开会，会议链接我还没建。\n阿宁：签到功能我还没跑完一遍，周一先测一下，有问题就跟你说。\n小周：可以。先把准备事项整理出来，我看看有没有漏的。<\/pre><button class=\"btn secondary small\" data-download=\"independent\">下载群聊练习材料<\/button><\/div><h2>你要做的事<\/h2><p>请AI帮你整理一份清单：先说明什么时候演示、演示什么，再列出谁准备什么、什么时候给。还没说清楚的地方，放在最后提醒小周。<\/p><p>用你自己的话问就可以，不需要写得和前面的提示词一样。先自己试一次；没有思路时，再打开下面的提示。<\/p><details><summary>没想好怎么开口？可以这样开始<\/summary><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可复制提示词<\/span><button class=\"copy\" data-copy=\"practice-help\">复制<\/button><\/div><pre id=\"practice-help\">帮我把下面的群聊整理成一份演示准备清单，给小周看。先写演示时间和内容，再列谁准备什么、什么时候给。群里没说清楚的地方，放在最后提醒一下。\n\n[把上面的群聊贴在这里]<\/pre><\/div><\/details><h2>完成后，自己检查这四处<\/h2><ul class=\"list\"><li>演示是下周三下午3点，持续一个小时；客户想看报名和签到。<\/li><li>账号由小林准备，周二下班前给；介绍材料由阿宁准备，周二中午前给。<\/li><li>小周负责演示；阿宁周一测试签到，不能写成“测试已通过”。<\/li><li>会议链接还没建，需要小周补上。<\/li><\/ul><p>群聊没有给具体日期，不用让AI擅自换算成某月某日。实际使用时，再根据聊天发生日期确认。<\/p><details id=\"change\"><summary>清单写好后，再看这条新消息<\/summary><pre>小周又发来一条消息：\n客户周三有事，演示改到周四上午10点，还是一个小时。\n账号和介绍材料按原来的时间给我，签到测试也照常。\n会议链接我明天建好后补上。<\/pre><p>把这条消息告诉AI，让它更新清单。注意：改的是演示时间，账号、介绍材料和签到测试的安排不变；链接仍没提供。<\/p><button class=\"btn secondary small\" data-download=\"independent-change\">下载后续消息<\/button><\/details><h2>这次只需要留下两样东西<\/h2><ol class=\"list\"><li>修改后的准备清单。<\/li><li>一句话说明你检查过哪里，例如：“我核对了时间，演示改到周四，准备材料仍按原时间交。”<\/li><\/ol><p>如果由带教同事看作业，让他检查：不用回头翻聊天，能否看懂时间和分工；有没有把没做的事情写成完成；有没有错误地把其他截止时间一起顺延。<\/p><p>这次练习能独立做成，再把方法用到一项真实工作里。做不顺的地方可以回到对应单元，不需要一次就全部掌握。<\/p><div class=\"notearea\"><label class=\"field\" for=\"practice\">保存你的练习结果<\/label><textarea id=\"practice\" data-note=\"practice\" placeholder=\"最终准备清单或保存位置：\n我亲自检查过的一处：\n我还想问的问题：\"><\/textarea><div class=\"savehint\">本机笔记 · 不自动提交；可随时从目录导出。<\/div><\/div><div class=\"row\"><button class=\"btn secondary\" data-export=\"notes\">导出笔记与练习<\/button><a class=\"btn\" href=\"#assessment\">做一组自测 →<\/a><\/div><div class=\"notice\">本页不会自动提交作业。需要交给带教同事时，请导出或复制给他。自测帮助检查理解，实际是否能独立完成，还要看你做出的清单。<\/div><p class=\"source\">方法参考：Anthropic AI Fluency 的分工、表达、判断、责任；练习为本课原创设计。 · <a href=\"#sources\">查看原始资料与改编说明 →<\/a><\/p>"}], "quiz": [{"q": "记录说“回复了8位用户，回放还没问清楚”，AI写成“解决了8位用户的问题”。你会怎么改？", "opts": ["读起来顺就不改", "改回回复了8位用户，并保留回放仍待答复", "让AI保证这句话没问题"], "a": 1, "why": "回复过不等于已经解决。未解决的回放问题需要保留。", "lesson": 1, "dim": "判断"}, {"q": "你贴了飞书链接，AI说打不开。怎样继续更合适？", "opts": ["让它根据标题猜一下", "把整份文档公开给所有人", "检查访问权限，或在允许范围内贴上相关内容"], "a": 2, "why": "你能打开不代表AI能打开。提供必要内容即可，不必扩大公开范围。", "lesson": 2, "dim": "责任"}, {"q": "写这周的周报，哪件事适合先交给AI？", "opts": ["根据随手记录整理草稿", "替设计同事承诺周一交海报", "自行决定活动延期"], "a": 0, "why": "整理已有材料适合作为起步任务；他人的承诺与活动安排需要实际确认。", "lesson": 3, "dim": "分工"}, {"q": "你觉得周报太正式，哪句话更能帮助AI改好？", "opts": ["你是顶级专家，要专业", "这份发工作群，像平时跟同事汇报那样写，短一点", "尽量用高级词汇"], "a": 1, "why": "说清使用场景和想要的语气，AI才更容易改到你需要的样子。", "lesson": 4, "dim": "表达"}, {"q": "AI写“海报已完成”，但你只是拿到了嘉宾照片。怎样反馈？", "opts": ["再优化一下", "别犯错", "照片已交给设计，海报还没完成，请按这个进度改"], "a": 2, "why": "指出具体事实比抽象要求更有用。照片到位不等于海报完成。", "lesson": 5, "dim": "表达"}, {"q": "客户演示从周三改到周四，同事明确准备时间不变。清单应该怎样改？", "opts": ["改演示时间，账号和介绍材料的截止时间保持不变", "所有截止时间都推迟一天", "把所有时间删掉"], "a": 0, "why": "只改实际发生变化的内容，不能自行扩大调整范围。", "lesson": 8, "dim": "判断"}, {"q": "你要知道一场活动现在是否还能报名，应该怎样做？", "opts": ["相信语气最肯定的回答", "查看活动官方报名页面的最新说明和状态", "只凭AI记忆里的时间判断"], "a": 1, "why": "当前报名状态需要最新可靠信息；模型记忆可能过期。", "lesson": 7, "dim": "分工"}, {"q": "同一人只算一次，看最后状态。小林报名后取消，阿宁报名，小陈连续填了两次报名。最后几人报名？", "opts": ["4人", "3人", "2人"], "a": 2, "why": "小林取消，阿宁和小陈各算一人，共2人。", "lesson": 7, "dim": "判断"}, {"q": "AI只在聊天里写好了通知，没有实际发送。你应该怎样告诉同事？", "opts": ["通知草稿写好了，还没发", "已经发到群里了", "大家已经收到了"], "a": 0, "why": "写好一段文字和实际发送是不同的动作。", "lesson": 6, "dim": "责任"}, {"q": "自测得了90分，接下来做什么更能看出你学会了？", "opts": ["只保存分数就够了", "自己整理一份新材料，再检查和修改结果", "把进度全勾上"], "a": 1, "why": "自测看理解，换材料独立做一次，才能观察实际使用能力。", "lesson": 8, "dim": "责任"}], "home": "<div class=\"crumb\"><a href=\"#framework\">全部课程<\/a> / 00 · AI办公入门<\/div><section class=\"hero\"><div><div class=\"eyebrow\">Your first useful result<\/div><h1>让 AI 帮你，<br>把一件事做好。<\/h1><p class=\"lead\">从一周的随手记录开始。<br>学会交代任务、检查草稿、处理变化，<br>最终交出别人能接着用的成果。<\/p><div class=\"meta\"><span>全员必修 · 零基础<\/span><span>无需编程<\/span><\/div><div class=\"row\"><a class=\"btn\" href=\"#lesson1\" id=\"start\">从五分钟体验开始 →<\/a><a class=\"btn secondary\" href=\"#lesson8\">看最终作业<\/a><\/div><\/div><svg class=\"hero-art\" viewBox=\"0 0 400 390\" role=\"img\" aria-label=\"从零散资料到可核验成果的线稿\"><ellipse cx=\"204\" cy=\"347\" rx=\"153\" ry=\"15\" fill=\"#ece8de\"/><g stroke=\"#555249\" stroke-width=\"1.5\" fill=\"#fffdf8\"><path d=\"M45 102L152 89L172 229L65 242Z\"/><path d=\"M61 79L168 91L153 230L46 218Z\"/><rect x=\"60\" y=\"94\" width=\"109\" height=\"139\" rx=\"3\"/><rect x=\"226\" y=\"147\" width=\"129\" height=\"160\" rx=\"3\"/><\/g><g fill=\"none\" stroke=\"#7c786e\" stroke-width=\"1.4\"><path d=\"M78 120H147M78 133H139M78 162H150M78 175H136M78 199H146M248 172H332M248 188H324M248 215H333M248 239H333M248 263H333\"/><path d=\"M180 164C230 160 226 97 272 103M264 95L274 103L264 110\" stroke=\"#aa4c32\" stroke-width=\"2\"/><path d=\"M292 318C254 359 182 337 181 280M174 288L181 278L188 287\" stroke=\"#aa4c32\" stroke-width=\"2\"/><\/g><g stroke=\"#426350\" stroke-width=\"2\" fill=\"none\"><path d=\"M236 210L240 214L247 204M236 234L240 238L247 228M236 258L240 262L247 252\"/><\/g><circle cx=\"289\" cy=\"83\" r=\"29\" fill=\"#efe7db\"/><path d=\"M277 84L285 92L303 73\" fill=\"none\" stroke=\"#aa4c32\" stroke-width=\"2\"/><text x=\"202\" y=\"376\" fill=\"#77746a\" font-size=\"10\" font-family=\"monospace\" text-anchor=\"middle\" letter-spacing=\"2\">BRIEF · MAKE · CHECK · DELIVER<\/text><\/svg><\/section><section class=\"band\"><div><span class=\"eyebrow\">学完你能做到<\/span><p class=\"caption\">第一课 / 原编号00<\/p><\/div><div><blockquote>交代清楚一项任务，<br>检查后，把结果用起来。<\/blockquote><p class=\"caption\">核心学习约35–45分钟，实操约15–20分钟，自测约8分钟。五类场景可选学；时间为估计，支持分次完成。<\/p><\/div><\/section><div class=\"sectionhead\"><h2>一节只解决一个问题<\/h2><span class=\"caption\">先跟做，再独立完成<\/span><\/div><div class=\"cards\"><a class=\"card\" href=\"#lesson1\"><span class=\"eyebrow\">01<\/span><h3>五分钟写出周报 →<\/h3><p>从这周的随手记录开始，整理一份负责人看得懂的周报。<\/p><p class=\"read-time\">5 分钟<\/p><\/a><a class=\"card\" href=\"#lesson2\"><span class=\"eyebrow\">02<\/span><h3>理解 AI 的能力 →<\/h3><p>分清写得像、说得对和真的做了，少走几次返工。<\/p><p class=\"read-time\">6 分钟<\/p><\/a><a class=\"card\" href=\"#lesson3\"><span class=\"eyebrow\">03<\/span><h3>选择任务与工具 →<\/h3><p>先从有材料、结果好检查的小事开始。<\/p><p class=\"read-time\">6 分钟<\/p><\/a><a class=\"card\" href=\"#lesson4\"><span class=\"eyebrow\">04<\/span><h3>把要求说清楚 →<\/h3><p>先说要干什么，再给材料；有具体偏好就补一句。<\/p><p class=\"read-time\">7 分钟<\/p><\/a><a class=\"card\" href=\"#lesson5\"><span class=\"eyebrow\">05<\/span><h3>追问与修改 →<\/h3><p>指出哪句话有问题，再说你想怎么改。<\/p><p class=\"read-time\">6 分钟<\/p><\/a><a class=\"card\" href=\"#lesson6\"><span class=\"eyebrow\">06<\/span><h3>检查后再使用 →<\/h3><p>重点看人名、数字、时间和进度，不只看文字顺不顺。<\/p><p class=\"read-time\">5 分钟<\/p><\/a><a class=\"card\" href=\"#lesson7\"><span class=\"eyebrow\">07<\/span><h3>五个办公例子 →<\/h3><p>每个例子都给出原话、可以怎么问，以及结果该是什么样。<\/p><p class=\"read-time\">选学 · 8–12 分钟<\/p><\/a><a class=\"card\" href=\"#lesson8\"><span class=\"eyebrow\">08<\/span><h3>独立练习 →<\/h3><p>把项目群里的几条消息，整理成一份准备清单。<\/p><p class=\"read-time\">15–20 分钟<\/p><\/a><\/div><h2>开始之前<\/h2><p>准备一个已获准使用的AI对话工具，以及保存成果的文档。所有示范素材均为虚构，工具回答会不同；用本课的检查标准判断，而非逐字匹配示例。<\/p><div class=\"notice\">页面负责带着学，不会调用AI。笔记与进度只存在本浏览器，支持导出，不跨设备同步。知识自测有独立入口，学习正文不混排正式试题与答案。<\/div><a href=\"#sources\">教学参考与课程说明 →<\/a><div class=\"row\"><a class=\"btn secondary\" href=\"lesson01.html#home\">接着学习第二课 · 数据安全与结果核验 →<\/a><\/div>", "framework": "<div class=\"crumb\">模数学习室 / AI办公能力课程<\/div><section class=\"hero\"><div><div class=\"eyebrow\">Working well with AI<\/div><h1>从会用工具，<br>到会完成工作。<\/h1><p class=\"lead\">一条从入门到协作、从实践到复用的学习路径。<br>每学一课，都留下一个能被检查的成果。<\/p><div class=\"meta\"><span>新人和老员工共同基础<\/span><span>7个章节 · 按需进阶<\/span><\/div><div class=\"row\"><a class=\"btn\" href=\"#home\">进入第一课 · AI办公入门 →<\/a><a class=\"btn secondary\" href=\"lesson01.html#home\">进入第二课 · 数据安全与结果核验 →<\/a><\/div><\/div><svg class=\"hero-art\" viewBox=\"0 0 400 390\" role=\"img\" aria-label=\"从零散资料到可核验成果的线稿\"><ellipse cx=\"204\" cy=\"347\" rx=\"153\" ry=\"15\" fill=\"#ece8de\"/><g stroke=\"#555249\" stroke-width=\"1.5\" fill=\"#fffdf8\"><path d=\"M45 102L152 89L172 229L65 242Z\"/><path d=\"M61 79L168 91L153 230L46 218Z\"/><rect x=\"60\" y=\"94\" width=\"109\" height=\"139\" rx=\"3\"/><rect x=\"226\" y=\"147\" width=\"129\" height=\"160\" rx=\"3\"/><\/g><g fill=\"none\" stroke=\"#7c786e\" stroke-width=\"1.4\"><path d=\"M78 120H147M78 133H139M78 162H150M78 175H136M78 199H146M248 172H332M248 188H324M248 215H333M248 239H333M248 263H333\"/><path d=\"M180 164C230 160 226 97 272 103M264 95L274 103L264 110\" stroke=\"#aa4c32\" stroke-width=\"2\"/><path d=\"M292 318C254 359 182 337 181 280M174 288L181 278L188 287\" stroke=\"#aa4c32\" stroke-width=\"2\"/><\/g><g stroke=\"#426350\" stroke-width=\"2\" fill=\"none\"><path d=\"M236 210L240 214L247 204M236 234L240 238L247 228M236 258L240 262L247 252\"/><\/g><circle cx=\"289\" cy=\"83\" r=\"29\" fill=\"#efe7db\"/><path d=\"M277 84L285 92L303 73\" fill=\"none\" stroke=\"#aa4c32\" stroke-width=\"2\"/><text x=\"202\" y=\"376\" fill=\"#77746a\" font-size=\"10\" font-family=\"monospace\" text-anchor=\"middle\" letter-spacing=\"2\">BRIEF · MAKE · CHECK · DELIVER<\/text><\/svg><\/section><section class=\"band\"><div><span class=\"eyebrow\">课程怎么组织<\/span><p class=\"caption\">沿用已讨论的大纲<\/p><\/div><div><blockquote>先学会一件事，再把方法带到下一件事。<\/blockquote><p class=\"caption\">第一课沿用原编号00，后续编号01–06保持稳定。自媒体写作安排在03团队协作课，仍为全员必修。<\/p><\/div><\/section><div class=\"sectionhead\"><h2>主要课程框架<\/h2><span class=\"caption\">前两课现已可学<\/span><\/div><section class=\"course-row\"><div class=\"index\">00<\/div><div><span class=\"tag\">基础认知<\/span><span class=\"tag\">全员必修<\/span><h2>AI办公入门<\/h2><p>独立完成一项可核验的办公任务。<\/p><p class=\"smalltext\">生成式AI与Agent的能力边界 · 任务分工与工具选择 · 目标、材料、输出与验收标准 · 迭代修改、结果核验与交接<\/p><p><b>动手完成：<\/b>跟着写一份周报，再独立把群聊整理成客户演示准备清单。<\/p><p><b>验收凭据：<\/b>修改后的准备清单＋一句亲自核对过的说明。<\/p><p class=\"caption\">35–45分钟核心学习＋15–20分钟实操 · 完整学习页与自测已制作<\/p><a class=\"btn small\" href=\"#home\">开始本课 →<\/a><\/div><\/section><section class=\"course-row\"><div class=\"index\">01<\/div><div><span class=\"tag\">基础保障<\/span><span class=\"tag\">全员必修<\/span><h2>数据安全与结果核验<\/h2><p>判断资料能否使用，并识别高后果错误。<\/p><p class=\"smalltext\">数据分类、脱敏与最小必要材料 · 账号、共享权限与外部工具边界 · 事实、引用、数字和时效核验 · 资料中异常指令与操作回执<\/p><p><b>动手完成：<\/b>从社区来访与入驻咨询开始，练习政策答复，再完成项目共学会内部安排与对外预告。<\/p><p><b>验收凭据：<\/b>内部安排＋对外预告＋检查记录。<\/p><p class=\"caption\">约75分钟 · 社区案例版学习页与自测已上线<\/p><a class=\"btn small\" href=\"lesson01.html#home\">开始第二课 →<\/a><\/div><\/section><section class=\"course-row\"><div class=\"index\">02<\/div><div><span class=\"tag\">共同工作环境<\/span><span class=\"tag\">全员必修<\/span><h2>飞书基础与团队用法<\/h2><p>让材料、进展和成果能被团队找到并接手。<\/p><p class=\"smalltext\">消息、群沟通、日历与待办 · 文档协作、评论、版本和权限 · 电子表格与多维表格的基础选择 · 团队目录、命名、来源与交接<\/p><p><b>动手完成：<\/b>建立一个小任务的材料目录、协作文档和进度表，验证接手人访问。<\/p><p><b>验收凭据：<\/b>实际可访问的成果包＋版本及权限检查。<\/p><p class=\"caption\">建议90–120分钟 · 框架已定，正文待制作<\/p><\/div><\/section><section class=\"course-row\"><div class=\"index\">03<\/div><div><span class=\"tag\">团队协作<\/span><span class=\"tag\">全员必修<\/span><h2>Team Agent／龙喵协作<\/h2><p>带着Agent推进多步骤工作，在关键节点作出判断。<\/p><p class=\"smalltext\">团队上下文、角色与任务边界 · 任务拆解、反馈、变更和交接 · 全员自媒体写作：目标、大纲、逐段共创 · 润色核验、排版封面与发布边界<\/p><p><b>动手完成：<\/b>跟练彬哥自媒体写作打样，再换素材独立完成一篇可审核文章。<\/p><p><b>验收凭据：<\/b>文章与封面预览＋关键修改对照＋来源与交接。<\/p><p class=\"caption\">建议120–150分钟，分两次学习 · 框架已定；彬哥原案例待庄庄提供<\/p><\/div><\/section><section class=\"course-row\"><div class=\"index\">04<\/div><div><span class=\"tag\">个人工作增强<\/span><span class=\"tag\">全员基础；开发型工具按岗进阶<\/span><h2>个人 Agent 与场景工具<\/h2><p>围绕岗位任务选择工具，管理个人上下文与可复用成果。<\/p><p class=\"smalltext\">资料研究、文档表格、多模态等场景 · 项目资料、偏好与记忆的适用范围 · 文件与工具权限、执行结果检查 · Claude Code／Codex等开发型工具进阶选修<\/p><p><b>动手完成：<\/b>用一种获准工具完成岗位任务，比较质量、总耗时和返工。<\/p><p><b>验收凭据：<\/b>输入、成果、核验记录与工具选择理由。<\/p><p class=\"caption\">建议90–120分钟 · 框架已定，正文待制作<\/p><\/div><\/section><section class=\"course-row\"><div class=\"index\">05<\/div><div><span class=\"tag\">工具连接<\/span><span class=\"tag\">全员理解；动手范围按岗位与权限<\/span><h2>飞书 CLI 与 Agent 协作<\/h2><p>理解并在允许范围内用命令接口连接AI与飞书。<\/p><p class=\"smalltext\">CLI、身份、权限与帮助文档 · 读取与检索的基础操作 · 明确授权后的文档或表格写入 · 回执、失败定位、回读与防重复<\/p><p><b>动手完成：<\/b>先读一个获准文档，再在指定测试资源内完成一次写入和回读。<\/p><p><b>验收凭据：<\/b>输入参数、执行回执、原资源核验；使用当前官方命令。<\/p><p class=\"caption\">建议90–120分钟 · 框架已定；实操需明确身份与权限<\/p><\/div><\/section><section class=\"course-row\"><div class=\"index\">06<\/div><div><span class=\"tag\">沉淀与带教<\/span><span class=\"tag\">全员掌握复盘；流程负责人进阶<\/span><h2>工作流、Skills 与复用<\/h2><p>把稳定做法变成别人能复用的流程。<\/p><p class=\"smalltext\">输入输出、依赖与验收标准 · SOP、模板、Skill的选择 · 例外处理、版本维护与改进 · 换材料测试、同伴交接和综合验收<\/p><p><b>动手完成：<\/b>将已完成任务沉淀为流程，让另一位同事换材料使用。<\/p><p><b>验收凭据：<\/b>流程文件＋新材料运行结果＋改进记录。<\/p><p class=\"caption\">建议90–120分钟 · 框架已定，正文待制作<\/p><\/div><\/section><div class=\"notice\">课程时间为编排建议，尚未经过真实学员试学计时。当前已完成00、01两课的学习页与自测；02–06课目前仅提供大纲。03课将在收到彬哥原始材料后制作真实案例回放。<\/div><h2>贯穿全程的四项能力<\/h2><div class=\"flow\"><div><b>会分工<\/b>区分AI可做与人须决定的工作<\/div><div><b>会表达<\/b>说明目标、材料、约束和结果<\/div><div><b>会判断<\/b>核对依据，发现并修正偏差<\/div><div><b>会负责<\/b>交付正确版本与真实执行状态<\/div><\/div><h2>学习与验收，分开记录<\/h2><p>每课按“示范 → 跟练 → 换材料 → 变更 → 交付”展开。学习进度自行标记；知识自测帮助找薄弱点；实操由指定验收人依据成果判定。全程综合验收建议采用跨工具任务与同伴交接，具体安排另行确定。<\/p><details><summary>开课需要准备什么？<\/summary><p>前两课可直接用教学模拟材料与获准的AI对话工具完成。真实岗位练习需要明确允许使用的工具和资料范围、带教人及提交方式。CLI实操另需相应身份和写入权限。本页面不会建立后台成绩库、通知员工或自动安排考试。<\/p><\/details><div class=\"row\"><a class=\"btn\" href=\"#home\">现在开始 · AI办公入门 →<\/a><button class=\"btn secondary\" data-download=\"framework\">下载课程框架<\/button><\/div>", "sources": "<article class=\"lesson\"><div class=\"eyebrow\">Teaching notes & sources<\/div><h1>学方法，<br>也保留依据。<\/h1><p class=\"intro\">参考公开课程的教学结构，围绕模数办公场景重新编写。无官方授权或认证含义。<\/p><h2>本次核对的公开资料<\/h2><div class=\"table-wrap\" role=\"region\" aria-label=\"教学对照表，可横向滚动\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>资料<\/th><th>采用的方法<\/th><th>落在本课哪里<\/th><\/tr><\/thead><tbody><tr><td><a href=\"https://anthropic.skilljar.com/ai-fluency-framework-foundations\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic · AI Fluency: Framework & Foundations ↗<\/a><\/td><td>4D：Delegation、Description、Discernment、Diligence；表达与判断循环<\/td><td>单元2–6及实操观察标准<\/td><\/tr><tr><td><a href=\"https://academy.openai.com/public/clubs/work-users-ynjqu/resources/chatgpt-basics\" target=\"_blank\" rel=\"noopener noreferrer\">OpenAI Academy · ChatGPT fundamentals ↗<\/a><\/td><td>从第一次对话入手，围绕工作用途追问和改进<\/td><td>单元1的第一次成果与单元2能力边界<\/td><\/tr><tr><td><a href=\"https://academy.openai.com/public/clubs/work-users-ynjqu/resources/prompting\" target=\"_blank\" rel=\"noopener noreferrer\">OpenAI Academy · Prompting ↗<\/a><\/td><td>任务、上下文、理想输出；具体反馈与迭代<\/td><td>单元4自然表达及单元5修改示范<\/td><\/tr><tr><td><a href=\"https://academy.openai.com/public/clubs/work-users-ynjqu/resources/customizing-chatgpt\" target=\"_blank\" rel=\"noopener noreferrer\">OpenAI Academy · Customizing ChatGPT ↗<\/a><\/td><td>固定指令、项目资料、样例与记忆<\/td><td>单元4进阶展开内容<\/td><\/tr><\/tbody><\/table><\/div><p class=\"smalltext\">核对日期：2026-11-17。Anthropic 核对的是公开课程介绍与目录，未声称完成全部注册课程；OpenAI 核对的是公开资源正文。资料中的具体型号、套餐与界面会变化，本课保留可迁移方法，实际可用能力以团队工具为准。<\/p><h2>我们怎样做了本地化<\/h2><p>用写周报串起前六个单元，再换群聊材料独立练习；把任务说明、示例输出和操作步骤分开；提供修改前后对照、可下载材料和一次后续消息练习。能力选择覆盖检索、推理、计算、多模态与Agent，不要求零基础员工同时掌握全部工具。<\/p><p>四项能力中文为便于教学的概括：分工、表达、判断、责任。它们不等于厂商的正式考试量表。本课时间、题目、80分自测线和实操判定建议均由模数设计，尚未经过真实学员校准。<\/p><h2>内容与案例边界<\/h2><p>所有办公记录、人物、时间和统计数据均为教学虚构。示例回答由课程作者编写，未使用产品运行截图。自媒体写作不属于本入门课，安排在03 Team Agent协作课；彬哥完整原材料由庄庄随后提供。<\/p><h2>记录和文件<\/h2><p>这是无需安装、可离线阅读的自包含HTML。笔记、勾选与自测草稿尝试保存在当前浏览器；存储受限时仅在页面内存保留。导出文件需自行交给指定人员。没有登录、网络上传、统一成绩库或自动提交功能。<\/p><p>下载或复制按钮在某些隔离预览中可能受浏览器限制。可下载HTML后用浏览器打开；复制失败会选中原文，便于手动复制。清除本机记录前建议先导出。<\/p><p class=\"caption\">制作：模数 CHRO · v3.0 · 2026-11-17<br>视觉沿用已认可的暖白、编辑式排版与线稿风格；未使用厂商品牌标识。<\/p><div class=\"row\"><a class=\"btn\" href=\"#home\">回到第一课 →<\/a><a class=\"btn secondary\" href=\"#framework\">课程框架<\/a><\/div><\/article>", "materials": {"demo": "这周的工作随手记\n周一：把上周活动的报名名单整理好了，重复报名的也合并了。\n周二：回了8位用户的问题，其中2位问能不能看回放。我去问了负责视频的同事，还没收到回复。\n周三：下周活动的通知写完了，发给负责人看了，还没确认，暂时没发到群里。\n周四：报名表加上了“公司”和“职位”两项，自己试填了一次，没发现问题。\n周五：活动海报还差一张嘉宾照片，已经找设计同事要了，暂时没拿到。\n下周：发活动通知、确认回放怎么安排、做完海报。", "change": "刚收到两个新消息：\n负责人已经确认活动通知可以用了，不过要等海报做好，再一起发到群里。\n嘉宾照片拿到了，已经转给设计同事，海报还没做完。", "independent": "项目群里的几条消息\n小周：下周三下午3点给客户演示新版产品，留一个小时。客户最想看报名和签到两个功能。\n小林：演示用的账号我来准备，周二下班前给你。\n阿宁：我把操作流程做成几页介绍，周二中午前发群里。\n小周：好，我来演示。线上开会，会议链接我还没建。\n阿宁：签到功能我还没跑完一遍，周一先测一下，有问题就跟你说。\n小周：可以。先把准备事项整理出来，我看看有没有漏的。", "independent-change": "小周又发来一条消息：\n客户周三有事，演示改到周四上午10点，还是一个小时。\n账号和介绍材料按原来的时间给我，签到测试也照常。\n会议链接我明天建好后补上。"}, "framework_md": "# AI办公能力课程框架\n\n2026-11-18｜前两课合并发布｜依据庄庄最新安排\n\n第一课保留原编号00，名称为AI办公入门；后续编号01–06不变。自媒体写作仍为全员必修，移至03 Team Agent协作课，彬哥原始素材待提供。\n\n## 教学原则\n\n- 从小任务获得第一份可用成果，再理解概念。\n- 观看示范、动手跟练、换材料独立完成、根据新消息修改、检查后使用。\n- 学习与知识自测分开；能力通过看实操。\n- 时间为编排建议，未经过真实学员计时。\n\n## 00 AI办公入门\n\n- 定位：基础认知；全员必修。\n- 目标：独立完成一项可核验的办公任务。\n- 建议用时：35–45分钟核心学习＋15–20分钟实操。\n- 内容：生成式AI与Agent的能力边界；任务分工与工具选择；目标、材料、输出与验收标准；迭代修改、结果核验与交接。\n- 实操：跟着写一份周报，再独立把群聊整理成客户演示准备清单。\n- 验收证据：修改后的准备清单＋一句亲自核对过的说明。\n- 制作状态：完整学习页与自测已制作。\n\n## 01 数据安全与结果核验\n\n- 定位：基础保障；全员必修。\n- 目标：判断资料能否使用，并识别高后果错误。\n- 建议用时：建议60–80分钟。\n- 内容：数据分类、脱敏与最小必要材料；账号、共享权限与外部工具边界；事实、引用、数字和时效核验；资料中异常指令与操作回执。\n- 实操：从社区来访与入驻咨询开始，练习政策答复，再完成项目共学会内部安排与对外预告。\n- 验收证据：内部安排＋对外预告＋检查记录。\n- 制作状态：社区案例版学习页与自测已上线。\n\n## 02 飞书基础与团队用法\n\n- 定位：共同工作环境；全员必修。\n- 目标：让材料、进展和成果能被团队找到并接手。\n- 建议用时：建议90–120分钟。\n- 内容：消息、群沟通、日历与待办；文档协作、评论、版本和权限；电子表格与多维表格的基础选择；团队目录、命名、来源与交接。\n- 实操：建立一个小任务的材料目录、协作文档和进度表，验证接手人访问。\n- 验收证据：实际可访问的成果包＋版本及权限检查。\n- 制作状态：框架已定，正文待制作。\n\n## 03 Team Agent／龙喵协作\n\n- 定位：团队协作；全员必修。\n- 目标：带着Agent推进多步骤工作，在关键节点作出判断。\n- 建议用时：建议120–150分钟，分两次学习。\n- 内容：团队上下文、角色与任务边界；任务拆解、反馈、变更和交接；全员自媒体写作：目标、大纲、逐段共创；润色核验、排版封面与发布边界。\n- 实操：跟练彬哥自媒体写作打样，再换素材独立完成一篇可审核文章。\n- 验收证据：文章与封面预览＋关键修改对照＋来源与交接。\n- 制作状态：框架已定；彬哥原案例待庄庄提供。\n\n## 04 个人 Agent 与场景工具\n\n- 定位：个人工作增强；全员基础；开发型工具按岗进阶。\n- 目标：围绕岗位任务选择工具，管理个人上下文与可复用成果。\n- 建议用时：建议90–120分钟。\n- 内容：资料研究、文档表格、多模态等场景；项目资料、偏好与记忆的适用范围；文件与工具权限、执行结果检查；Claude Code／Codex等开发型工具进阶选修。\n- 实操：用一种获准工具完成岗位任务，比较质量、总耗时和返工。\n- 验收证据：输入、成果、核验记录与工具选择理由。\n- 制作状态：框架已定，正文待制作。\n\n## 05 飞书 CLI 与 Agent 协作\n\n- 定位：工具连接；全员理解；动手范围按岗位与权限。\n- 目标：理解并在允许范围内用命令接口连接AI与飞书。\n- 建议用时：建议90–120分钟。\n- 内容：CLI、身份、权限与帮助文档；读取与检索的基础操作；明确授权后的文档或表格写入；回执、失败定位、回读与防重复。\n- 实操：先读一个获准文档，再在指定测试资源内完成一次写入和回读。\n- 验收证据：输入参数、执行回执、原资源核验；使用当前官方命令。\n- 制作状态：框架已定；实操需明确身份与权限。\n\n## 06 工作流、Skills 与复用\n\n- 定位：沉淀与带教；全员掌握复盘；流程负责人进阶。\n- 目标：把稳定做法变成别人能复用的流程。\n- 建议用时：建议90–120分钟。\n- 内容：输入输出、依赖与验收标准；SOP、模板、Skill的选择；例外处理、版本维护与改进；换材料测试、同伴交接和综合验收。\n- 实操：将已完成任务沉淀为流程，让另一位同事换材料使用。\n- 验收证据：流程文件＋新材料运行结果＋改进记录。\n- 制作状态：框架已定，正文待制作。\n\n## 全程验收\n\n每课保留成果和必要的检查说明；知识自测80分为学习参考线，不替代实操。实操按分工、表达、判断、责任四项观察；关键事实错误须纠正后复核。综合验收建议选另一份材料完成一项跨工具任务，并让同事接手；此为课程设计，尚未组织正式考试。\n\n## 开课依赖\n\n本课可直接使用虚构材料。真实岗位任务与后续实操需要团队指定带教与收卷方式、允许工具及资料范围；CLI实操需要确认身份与写入权限。未开通统一成绩库，未自动安排人员或考试。\n"};</script><script>(()=>{
'use strict';
const {lessons:LESSONS,quiz:QUIZ,home:HOME,framework:FRAMEWORK,sources:SOURCES,materials:MATERIALS}=DATA;
const KEY='moshu-ai-office-00-v3';
const blank=()=>({done:[],notes:{},checks:[],answers:{},last:1});
let state=blank(),persistent=true,toastTimer;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&typeof raw==='object'){
state.done=Array.isArray(raw.done)?[...new Set(raw.done.filter(n=>Number.isInteger(n)&&n>=1&&n<=8))]:[];
state.notes=raw.notes&&typeof raw.notes==='object'&&!Array.isArray(raw.notes)?Object.fromEntries(Object.entries(raw.notes).filter(([k,v])=>typeof v==='string')):{};
state.checks=Array.isArray(raw.checks)?raw.checks.filter(n=>Number.isInteger(n)&&n>=0&&n<=3):[];
if(raw.answers&&typeof raw.answers==='object')Object.entries(raw.answers).forEach(([k,v])=>{if(/^\d+$/.test(k)&&+k<QUIZ.length&&Number.isInteger(v)&&v>=0&&v<QUIZ[+k].opts.length)state.answers[k]=v;});
state.last=Number.isInteger(raw.last)&&raw.last>=1&&raw.last<=8?raw.last:1;}
localStorage.setItem(KEY,JSON.stringify(state));}catch(e){persistent=false;}
const main=document.querySelector('main');
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){persistent=false;}document.querySelector('#storageNotice').classList.toggle('hidden',persistent);}
function toast(s){const el=document.querySelector('#toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),4000);}
function progress(){document.querySelector('#progress').value=state.done.length;document.querySelector('#progressLabel').textContent=`已学习 ${state.done.length} / 8 个单元`;document.querySelectorAll('[data-done]').forEach(el=>el.textContent=state.done.includes(+el.dataset.done)?'✓':'');}
function footer(){return '<footer><span>模数 OPC · AI办公能力课程</span><span>HTML v2.0 / 第一课沿用原编号00</span></footer>';}
function route(requested){
clearTimeout(toastTimer);document.querySelector('#toast').classList.add('hidden');
let id=typeof requested==='string'?requested:(location.hash.slice(1)||'framework');if(id==='main'){main.focus();return;}
if(!/^(framework|home|sources|assessment|lesson[1-8])$/.test(id))id='framework';
document.body.classList.toggle('exam-mode',id==='assessment');document.querySelector('.layout').classList.remove('menu-open');document.querySelector('#menu').setAttribute('aria-expanded','false');
document.querySelectorAll('[data-nav]').forEach(el=>{const active=el.dataset.nav===id;el.classList.toggle('active',active);if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});
if(id==='framework')main.innerHTML=FRAMEWORK+footer();
else if(id==='home'){main.innerHTML=HOME+footer();if(state.done.length||Object.keys(state.notes).length){const a=document.querySelector('#start');a.href='#lesson'+state.last;a.textContent='继续上次学习 →';}}
else if(id==='sources')main.innerHTML=SOURCES+footer();
else if(id==='assessment'){main.innerHTML=exam()+footer();bindExam();}
else{const i=+id.slice(6),l=LESSONS[i-1];state.last=i;save();main.innerHTML=`<article class="lesson"><div class="crumb"><a href="#home">AI办公入门</a> / ${String(i).padStart(2,'0')} / ${l.time}</div><div class="eyebrow">Unit ${String(i).padStart(2,'0')} of 08</div><h1>${l.title}</h1><p class="intro">${l.desc}</p>${l.body}<div class="bottom"><label class="complete"><input type="checkbox" id="complete" ${state.done.includes(i)?'checked':''}>已学完本单元（非验收成绩）</label><div class="row"><a class="btn secondary small" href="${i===1?'#home':'#lesson'+(i-1)}">← 上一页</a><a class="btn small" href="${i===8?'#assessment':'#lesson'+(i+1)}">${i===8?'独立自测 →':'下一单元 →'}</a></div></div></article>`+footer();
document.querySelector('#complete').onchange=e=>{state.done=state.done.filter(n=>n!==i);if(e.target.checked)state.done.push(i);save();progress();};}
main.querySelectorAll('[data-note]').forEach(el=>{el.value=state.notes[el.dataset.note]||'';el.oninput=()=>{state.notes[el.dataset.note]=el.value;save();if(el.id.startsWith('b-')&&document.querySelector('#generatedPrompt'))makePrompt();};});
main.querySelectorAll('[data-check]').forEach(el=>{el.checked=state.checks.includes(+el.dataset.check);el.onchange=()=>{state.checks=state.checks.filter(n=>n!==+el.dataset.check);if(el.checked)state.checks.push(+el.dataset.check);save();};});
document.querySelector('#buildPrompt')?.addEventListener('click',makePrompt);
if(document.querySelector('#buildPrompt')&&['goal','material','output','boundary','quality'].some(k=>state.notes['b-'+k]))makePrompt();
main.dataset.route=id;progress();document.querySelector('#storageNotice').classList.toggle('hidden',persistent);window.scrollTo({top:0,left:0,behavior:'instant'});main.focus({preventScroll:true});
}
function makePrompt(){const get=k=>document.querySelector('#b-'+k).value.trim();const g=get('goal'),m=get('material'),o=get('output'),b=get('boundary'),q=get('quality');if(![g,m,o,b,q].some(Boolean)){toast('先写下你想让AI帮什么忙。');return;}
const text=[g, o?'这份内容的用途：'+o:'',q,b,m?'这是我的材料：\n'+m:''].filter(Boolean).join('\n\n');
document.querySelector('#builtPrompt').innerHTML='<div class="prompt"><div class="prompthead"><span class="label">你的要求 · 看一遍，改顺了再复制</span><button class="copy" data-copy="generatedPrompt">复制</button></div><pre id="generatedPrompt">'+esc(text)+'</pre></div>';}
async function copy(text,button){try{await navigator.clipboard.writeText(text);}catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.top='0';document.body.append(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();if(!ok){const node=document.getElementById(button.dataset.copy),range=document.createRange();range.selectNodeContents(node);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);toast('已选中原文，请手动复制。');return;}}
toast('已复制。请核对内容后粘贴到你的AI工具。');}
function download(name,text,type='text/plain;charset=utf-8'){try{const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('已请求下载；若预览阻止下载，请用浏览器打开HTML后操作。');}catch(e){toast('当前预览不支持下载，请下载HTML后在浏览器打开。');}}
const noteLabels={first:'第一次成果',mental:'AI能力与误信',delegate:'任务分工','b-goal':'请AI帮什么忙','b-material':'提供的材料','b-output':'给谁看、怎么用','b-boundary':'特别注意','b-quality':'希望写成什么样',iteration:'反馈与变更',handoff:'最终检查',transfer:'岗位场景迁移',practice:'独立作业包'};
function exportNotes(){download('AI办公入门_我的学习笔记.md','# AI办公入门｜我的学习笔记\n\n导出时间：'+new Date().toLocaleString('zh-CN')+'\n本机学习记录，未提交，非能力通过凭据。\n已标记学习：'+state.done.length+'/8个单元。\n\n'+Object.entries(noteLabels).map(([k,t])=>'## '+t+'\n\n'+(state.notes[k]||'（未填写）')).join('\n\n'));}
function exam(){return `<article class="lesson exam"><div class="crumb"><a href="#home">← 返回第一课</a> / 独立知识自测</div><div class="eyebrow">Check your understanding</div><h1>懂方法，也会判断。</h1><p class="intro">10道情境题，每题10分，约8分钟。80分为知识自测参考线，允许回看课程；通过后仍需完成独立实操。</p><p class="caption">本机自测 · 不上传 · 不生成厂商认证 · 页面包含解析，不作为保密正式考卷</p><form id="quizForm">${QUIZ.map((q,i)=>`<section class="question" id="q${i}"><h3 id="qtitle${i}">${String(i+1).padStart(2,'0')} / ${q.q}</h3><fieldset aria-labelledby="qtitle${i}" style="border:0;padding:0;margin:0"><legend class="caption">单选 · 10分</legend>${q.opts.map((t,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${state.answers[i]===j?'checked':''}><span>${t}</span></label>`).join('')}</fieldset><div class="review" id="review${i}"></div></section>`).join('')}<p id="examAlert" role="alert"></p><div class="row"><button type="submit" class="btn">查看自测结果 →</button><button type="button" id="retry" class="btn secondary">重新作答</button></div></form><div id="result" tabindex="-1" aria-live="polite"></div><div class="notice">本卷用于理解诊断。实操请保留修改后的准备清单和一句检查说明，由带教同事结合成果判断。</div></article>`;}
function resultData(){const dims={};let score=0;const wrong=[];QUIZ.forEach((q,i)=>{if(!dims[q.dim])dims[q.dim]={correct:0,total:0};dims[q.dim].total++;if(state.answers[i]===q.a){score+=10;dims[q.dim].correct++;}else wrong.push(i+1);});return {score,dims,wrong};}
function bindExam(){document.querySelectorAll('#quizForm input').forEach(el=>el.onchange=()=>{state.answers[+el.name.slice(1)]=+el.value;save();document.querySelector('#result').innerHTML='';document.querySelectorAll('.review').forEach(r=>r.innerHTML='');document.querySelector('#examAlert').textContent='';});
document.querySelector('#quizForm').onsubmit=e=>{e.preventDefault();const missing=QUIZ.map((q,i)=>i).filter(i=>state.answers[i]===undefined);if(missing.length){document.querySelector('#examAlert').textContent='还有 '+missing.length+' 题未作答，请先完成。';document.querySelector(`[name="q${missing[0]}"]`).focus();return;}
const {score,dims,wrong}=resultData();QUIZ.forEach((q,i)=>{document.querySelector('#review'+i).innerHTML=`<div class="feedback"><b>${state.answers[i]===q.a?'回答正确':'需要再看一看'}</b> · 正确选项：${q.opts[q.a]}<p>${q.why}</p><a href="#lesson${q.lesson}">回到第${q.lesson}单元复习 →</a></div>`;});
document.querySelector('#result').innerHTML=`<div class="result"><span class="label">本次知识自测</span><strong>${score}</strong> / 100<p>${score>=80?'已达到自测参考线。下一步：完成群聊准备清单练习。':'建议回看错题对应单元，再重做一次。'}</p><div class="flow">${Object.entries(dims).map(([k,v])=>`<div><b>${k}</b>${v.correct} / ${v.total}题正确</div>`).join('')}</div><p class="smalltext">分项题数有限，仅用于定位知识点，不能直接作为能力评级。</p><div class="row"><button type="button" class="btn secondary small" id="exportScore">导出本次结果</button><a href="#lesson8">查看独立作业 →</a></div><p class="caption">成绩未上传；学习完成和实操通过分别判断。</p></div>`;
document.querySelector('#exportScore').onclick=()=>download('AI办公入门_知识自测.json',JSON.stringify({course:'AI办公入门',version:'3.0',at:new Date().toISOString(),score,dims,wrongQuestions:wrong,answers:state.answers,status:'本机知识自测；未提交；非实操认证'},null,2),'application/json;charset=utf-8');document.querySelector('#result').focus();};
document.querySelector('#retry').onclick=()=>{state.answers={};save();route();toast('已清空答案，可以重新作答。');};}
document.addEventListener('click',e=>{const link=e.target.closest('a[href^="#"]');if(link){e.preventDefault();const hash=link.getAttribute('href');try{history.pushState(null,'',hash);}catch(err){}route(hash.slice(1));return;}const copyBtn=e.target.closest('[data-copy]');if(copyBtn){const node=document.getElementById(copyBtn.dataset.copy);if(node)copy(node.innerText,copyBtn);}const d=e.target.closest('[data-download]');if(d){const key=d.dataset.download;download(key==='framework'?'AI办公能力_课程框架.md':'AI办公入门_'+key+'.txt',key==='framework'?DATA.framework_md:MATERIALS[key]);}if(e.target.closest('[data-export="notes"]'))exportNotes();});
document.querySelector('#menu').onclick=()=>{const open=document.querySelector('.layout').classList.toggle('menu-open');document.querySelector('#menu').setAttribute('aria-expanded',String(open));};
document.querySelector('#reset').onclick=()=>{if(confirm('清除本浏览器中本课的进度、笔记与自测草稿？建议先导出。')){state=blank();save();route();toast('已清除本课本机记录。');}};
window.addEventListener('hashchange',route);window.addEventListener('popstate',route);route();
})();
</script></body></html>
