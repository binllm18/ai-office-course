a></nav><div class="progress-box"><div class="caption" id="progressLabel">已学习 0 / 8 个单元</div><progress id="progress" max="8" value="0" aria-label="自行标记的学习进度"></progress><p>学习进度自行标记，<br>理解与实操分别判断。</p></div><div class="sidefoot"><button class="textbtn" data-export="notes">导出本课笔记</button><a href="#sources" data-nav="sources">教学参考与说明</a><button class="textbtn" id="reset">清除本课本机记录</button></div></aside><main id="main" tabindex="-1"></main></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div><noscript><p style="padding:30px">请启用JavaScript以使用课程目录和学习交互。</p></noscript><script>const DATA={"lessons": [{"short": "日历邀约", "title": "先把会议<br>约清楚。", "desc": "让伙伴知道何时参加、讨论什么、从哪里进入。", "time": "6分钟", "body": "<h2>案例：商议一场社区项目交流活动<\/h2><p>你负责邀请内部同事与合作伙伴，讨论活动安排和双方分工。会后交付纪要、行动表和跟进消息。全课人物与记录均为教学模拟。<\/p><ol><li style=\"margin:16px 0\">打开飞书<b>日历 → 创建日程<\/b>，填写主题、起止时间、参与人，并添加飞书视频会议。<\/li><li style=\"margin:16px 0\">写清会议目标、议程和会前资料。外部伙伴可通过外部联系人或邮箱邀请，以当前组织支持的方式为准。<\/li><li style=\"margin:16px 0\">保存后检查接受状态，必要时另行确认。会前用伙伴的实际身份确认<b>能入会、能读资料<\/b>。<\/li><\/ol><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">会议邀请模板<\/span><button class=\"copy\" data-copy=\"invite\">复制<\/button><\/div><pre id=\"invite\">教学模拟｜时间均为2026年、北京时间\n主题：社区项目交流活动｜合作沟通\n时间：11月24日14:00—14:30\n目标：确认活动方向、双方分工与下一步\n议程：活动安排10分钟、分工15分钟、确认行动5分钟\n会前材料：[活动方案链接]\n入会方式：[飞书会议链接]<\/pre><\/div><button class=\"btn secondary small\" data-download=\"invite\">下载邀请模板<\/button><div class=\"notice\">发出邀请，不等于对方已确认。改时间要更新原日程并通知参与者；取消会议也要取消原日程。网页访客能否入会取决于会议设置。<\/div><div class=\"notearea\"><label class=\"field\" for=\"note1\">记下一条要点或你的实操结果<\/label><textarea id=\"note1\" data-note=\"note1\" placeholder=\"只填写练习信息，不放真实敏感资料\"><\/textarea><div class=\"savehint\">仅本机保存，可导出；不会自动提交。<\/div><\/div>"}, {"short": "会议与云录制", "title": "开好会议，<br>留下记录。", "desc": "飞书线上会议使用云录制；其他通话和面谈见下一单元。", "time": "5分钟", "body": "<h2>开会前<\/h2><ol><li style=\"margin:16px 0\">从日程入会，检查麦克风与扬声器；核对外部人员入会限制、等候室等设置。<\/li><li style=\"margin:16px 0\">共享材料优先选择指定窗口，避免展示无关聊天和文件。<\/li><li style=\"margin:16px 0\">说明录制用途与查看范围，取得同意后，由有权限的人开启<b>开始录制 → 云录制<\/b>；无权限时请求主持人协助。<\/li><\/ol><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">录制前先说明<\/span><button class=\"copy\" data-copy=\"consent\">复制<\/button><\/div><pre id=\"consent\">为方便核对结论，想录音用于整理纪要。原始记录仅供项目组查看，对外另行分享确认后的纪要。大家是否同意？<\/pre><\/div><div class=\"notice\">不要默认会议自动录制。检查录制状态；无法录制或对方不同意时，安排人工记录。<\/div><h2>结束前，用一分钟确认<\/h2><p><b>定了什么？什么没定？谁在何时交什么？<\/b><\/p><p>例如：“小林明天17点前交议程初稿；陈悦后天12点前确认嘉宾。活动日期仍待确认。”<\/p><p>录制结束并处理完成后，从相关通知或妙记入口查找记录；访问范围还要单独检查。<\/p><div class=\"notearea\"><label class=\"field\" for=\"note2\">记下一条要点或你的实操结果<\/label><textarea id=\"note2\" data-note=\"note2\" placeholder=\"只填写练习信息，不放真实敏感资料\"><\/textarea><div class=\"savehint\">仅本机保存，可导出；不会自动提交。<\/div><\/div>"}, {"short": "通话与线下录音", "title": "没开飞书会议，<br>也能生成妙记。", "desc": "电脑微信通话、线下面谈，都可以练习“开始录音转写”。先确认收音，再正式记录。", "time": "8分钟", "body": "<h2>三个场景，选对入口<\/h2><div class=\"table-wrap\" role=\"region\" aria-label=\"操作对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>场景<\/th><th>怎么记录<\/th><th>先检查<\/th><\/tr><\/thead><tbody><tr><td>飞书线上会议<\/td><td>会议中开启云录制<\/td><td>录制权限与录制状态<\/td><\/tr><tr><td>电脑打微信电话<\/td><td>飞书中的“开始录音转写”<\/td><td>能否同时采集自己和对方的声音<\/td><\/tr><tr><td>线下见面、访谈<\/td><td>电脑或手机飞书录音转写<\/td><td>距离、环境噪声及每个人的收音<\/td><\/tr><\/tbody><\/table><\/div><h2>通用操作：告知 → 试录 → 正式录音 → 保存<\/h2><ol><li style=\"margin:16px 0\"><b>先告知并取得同意。<\/b>说明记录用途和谁能查看，使用上一单元的示范话术。<\/li><li style=\"margin:16px 0\"><b>进入飞书的妙记／录音入口，选择“开始录音转写”。<\/b>不同版本位置可能不同，可从“视频会议 → 妙记”或搜索“妙记”查找；手机端可在妙记首页点麦克风。按提示授予麦克风等必要权限。<\/li><li style=\"margin:16px 0\"><b>先做约20秒试录。<\/b>双方各说一句，检查转写；结束这段测试并回放，确认两边都清楚，再新建正式录音。<\/li><li style=\"margin:16px 0\"><b>正式开始后检查录音状态。<\/b>线下面谈把设备放在双方都能清晰收音的位置；尽量轮流说话，重要日期、数字和决定复述一次。<\/li><li style=\"margin:16px 0\"><b>结束时停止录音并保存。<\/b>等待上传、转写完成，命名为“日期＋对象＋主题”，再检查关键内容和访问范围。<\/li><\/ol><h2>电脑微信通话：最容易漏掉对方声音<\/h2><div class=\"notice\"><b>戴耳机时，不能默认麦克风能录到对方声音。<\/b>如果当前版本提供系统音频／电脑声音采集选项，按提示启用并授权，再试录确认。只有麦克风输入时，可能只录到自己。<\/div><p>若无法采集对方声音，可在合适且不影响他人的环境下，经对方同意使用扬声器外放，让麦克风收音，并再次试录；注意回声和杂音。仍录不清楚时，改用双方同意的飞书会议，或人工记录。<\/p><details><summary>找不到入口，或已有录音怎么办？<\/summary><p>先检查客户端版本、账号能力与企业设置。也可使用手机飞书录音；已有获准使用的音视频文件，可在桌面端妙记<b>上传 → 上传本地文件<\/b>后转写。不要以扩大资料公开范围来解决权限问题。<\/p><\/details><div class=\"example\"><span class=\"label\">一分钟实操<\/span><p>找一位知情同伴，轮流说：“活动日期暂未确定”“我明天17点前交初稿”。生成测试妙记，回放并找出这两句话。<b>完成标准：两人的声音都清楚，文字能回到原音频核对。<\/b><\/p><\/div><button class=\"btn secondary\" data-download=\"recordcheck\">下载录音检查卡<\/button><p class=\"smalltext\">桌面端录音支持已有官方说明；系统音频的具体开关和可用性依设备、版本与权限而异。本课未实测你的设备，双向试录是必要检查。<\/p><div class=\"notearea\"><label class=\"field\" for=\"note3\">记下一条要点或你的实操结果<\/label><textarea id=\"note3\" data-note=\"note3\" placeholder=\"只填写练习信息，不放真实敏感资料\"><\/textarea><div class=\"savehint\">仅本机保存，可导出；不会自动提交。<\/div><\/div>"}, {"short": "核对妙记", "title": "先核对原话，<br>再整理结论。", "desc": "妙记保留过程，纪要提炼经过核对的决定和行动。", "time": "5分钟", "body": "<h2>只盯住五件事<\/h2><div class=\"table-wrap\" role=\"region\" aria-label=\"操作对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>检查项<\/th><th>怎么查<\/th><\/tr><\/thead><tbody><tr><td>人名<\/td><td>说话人是否识别正确<\/td><\/tr><tr><td>数字和日期<\/td><td>回放对应片段，不凭转写猜<\/td><\/tr><tr><td>决定<\/td><td>“可以考虑”有没有被误写为“已确定”<\/td><\/tr><tr><td>行动<\/td><td>负责人和期限是否真的说清楚<\/td><\/tr><tr><td>完整性<\/td><td>是否漏录一方或遗漏重要段落<\/td><\/tr><\/tbody><\/table><\/div><p>有疑问时，点击相关文字定位原音频。自动摘要也需要核对。导出文字时，建议保留<b>说话人和时间戳<\/b>；无法导出时检查所有者设置。<\/p><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">本课模拟转写<\/span><button class=\"copy\" data-copy=\"transcript\">复制<\/button><\/div><pre id=\"transcript\">教学模拟｜11月24日合作会议｜时间均为2026年、北京时间\n[03:10] 小林：活动时间可以考虑12月4日下午，我还要确认场地。\n[04:05] 陈悦：我也要问两位分享嘉宾，今天先不定日期。\n[12:20] 小林：议程初稿我在11月25日17点前发给你。\n[13:00] 陈悦：我在11月26日12点前确认两位嘉宾的意向。\n[18:40] 小林：报名页需要制作，负责人我们会后再定。\n[25:10] 双方确认：先完成议程和嘉宾确认，再确定活动日期。<\/pre><\/div><button class=\"btn secondary small\" data-download=\"transcript\">下载模拟转写<\/button><h2>内部材料单独放<\/h2><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">内部备注 · 不提供给对外纪要任务<\/span><button class=\"copy\" data-copy=\"internal\">复制<\/button><\/div><pre id=\"internal\">教学模拟｜内部筹备备注，与对外材料分开保存\n预算上限为8000元，尚未批准，仅供内部讨论，不对外提供。<\/pre><\/div><div class=\"notice\">活动日期未定，报名页未分工。内部预算不应出现在对外纪要里；这次整理无需把内部备注交给豆包工作。<\/div><div class=\"notearea\"><label class=\"field\" for=\"note4\">记下一条要点或你的实操结果<\/label><textarea id=\"note4\" data-note=\"note4\" placeholder=\"只填写练习信息，不放真实敏感资料\"><\/textarea><div class=\"savehint\">仅本机保存，可导出；不会自动提交。<\/div><\/div>"}, {"short": "交给豆包工作", "title": "把材料变成<br>可用成果。", "desc": "使用“豆包工作”，按任务生成文档和表格，再打开检查。", "time": "8分钟", "body": "<ol><li style=\"margin:16px 0\">打开<b>豆包工作<\/b>，使用已开通、获准处理这类材料的工作身份，确认组织。个人与企业身份不能混用。<\/li><li style=\"margin:16px 0\">新建工作任务，添加核对过的转写文件，或当前账号有权读取的飞书资料链接。读取成功与否以实际反馈为准。<\/li><li style=\"margin:16px 0\">说清材料、目标、成果形式和完成标准。下面的指令可直接配合本课模拟转写使用。<\/li><\/ol><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可以这样说<\/span><button class=\"copy\" data-copy=\"workprompt\">复制<\/button><\/div><pre id=\"workprompt\">请根据提供的会议转写，完成本次合作会议的会后整理。\n生成三项成果：\n1. 给合作伙伴看的会议纪要：已确认事项、待确认问题、下一步行动，正文不超过500字。\n2. 行动清单：事项、负责人、截止时间、交付物、状态。\n3. 不超过150字的跟进消息草稿。\n要求：仅依据材料，不补写承诺；缺失信息标为“待确认”。区分提议和已确认决定。在单独的核验说明中标注关键结论对应的时间点。\n生成可编辑文档和表格；不能直接创建飞书成果时，提供可下载文件。\n只生成草稿，不发送消息、不修改原材料或分享权限。<\/pre><\/div><div class=\"notice\">读不到链接时，在允许范围内添加文本或文件；不要把原文档改成公开。需要本地文件授权时，只选择本次任务所需文件或文件夹。<\/div><h2>看到“完成”，还要打开成果<\/h2><p>检查能否打开、编辑，内容是否有据。只有文字时，可继续要求生成可编辑文档、表格并提供成果链接或文件。<\/p><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">发现错误，定点修改<\/span><button class=\"copy\" data-copy=\"revise\">复制<\/button><\/div><pre id=\"revise\">活动日期仍待确认，请修正所有相关表述。报名页负责人和截止时间均保留“待确认”，其他正确内容保持不变。<\/pre><\/div><p>豆包工作能做哪些跨应用操作、能否直接创建飞书成果，以当前账号支持和任务回执为准。本课只生成草稿，不要求向真实伙伴发送。<\/p><div class=\"notearea\"><label class=\"field\" for=\"note5\">记下一条要点或你的实操结果<\/label><textarea id=\"note5\" data-note=\"note5\" placeholder=\"只填写练习信息，不放真实敏感资料\"><\/textarea><div class=\"savehint\">仅本机保存，可导出；不会自动提交。<\/div><\/div>"}, {"short": "纪要与行动", "title": "写清决定，<br>接住下一步。", "desc": "对照参考检查，不把讨论写成承诺，不替别人分配未确认的工作。", "time": "5分钟", "body": "<h2>对外纪要参考<\/h2><p><b>会议：<\/b>社区项目交流活动合作沟通<br><b>日期：<\/b>2026年11月24日<\/p><p><b>已确认：<\/b>先完成议程初稿和嘉宾意向确认，再确定活动日期。<\/p><p><b>待确认：<\/b>12月4日下午仅为候选时间；场地、嘉宾安排尚未确认。报名页制作负责人和期限待定。<\/p><div class=\"table-wrap\" role=\"region\" aria-label=\"操作对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>事项<\/th><th>负责人<\/th><th>截止时间<\/th><th>交付物<\/th><th>状态<\/th><\/tr><\/thead><tbody><tr><td>议程初稿<\/td><td>小林<\/td><td>11月25日17:00<\/td><td>议程初稿<\/td><td>待提交<\/td><\/tr><tr><td>确认两位嘉宾意向<\/td><td>陈悦<\/td><td>11月26日12:00<\/td><td>嘉宾意向确认结果<\/td><td>待确认<\/td><\/tr><tr><td>制作报名页<\/td><td>待确认<\/td><td>待确认<\/td><td>报名页<\/td><td>待明确分工<\/td><\/tr><\/tbody><\/table><\/div><p class=\"caption\">均为2026年、北京时间。核验依据：候选日期03:10/04:05；议程12:20；嘉宾13:00；报名页18:40；先后顺序25:10。<\/p><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">跟进消息草稿<\/span><button class=\"copy\" data-copy=\"follow\">复制<\/button><\/div><pre id=\"follow\">陈悦好，今天的会议纪要已整理：[纪要链接]。我会在11月25日17点前提交议程初稿；请你在11月26日12点前确认嘉宾意向。活动日期和报名页分工仍待确认，如纪要有遗漏请指出。<\/pre><\/div><h2>落实到飞书任务<\/h2><p>为已确认行动创建任务，填写负责人、截止时间和交付物，附上纪要链接。未明确负责人的事项保留“待确认”；后续变更同步更新任务与纪要。<\/p><div class=\"notice\">生成纪要、发送消息、对方确认、任务完成，是四种不同状态。分别凭实际结果判断。<\/div><div class=\"notearea\"><label class=\"field\" for=\"note6\">记下一条要点或你的实操结果<\/label><textarea id=\"note6\" data-note=\"note6\" placeholder=\"只填写练习信息，不放真实敏感资料\"><\/textarea><div class=\"savehint\">仅本机保存，可导出；不会自动提交。<\/div><\/div>"}, {"short": "分享与权限", "title": "四类权限，<br>分别检查。", "desc": "能入会，不代表能看妙记；能看纪要，也不代表能编辑。", "time": "6分钟", "body": "<div class=\"table-wrap\" role=\"region\" aria-label=\"操作对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>设置位置<\/th><th>控制什么<\/th><th>本案例建议<\/th><\/tr><\/thead><tbody><tr><td>日历日程<\/td><td>日程及详情可见范围<\/td><td>选合适日历与可见范围，不写内部预算<\/td><\/tr><tr><td>飞书会议<\/td><td>谁能加入、如何进入<\/td><td>允许受邀伙伴入会，按需设置等候或验证<\/td><\/tr><tr><td>妙记分享<\/td><td>原始音频、转写的访问与导出<\/td><td>只向必要成员开放，单独核对导出设置<\/td><\/tr><tr><td>纪要文档<\/td><td>查看、评论、编辑和外部分享<\/td><td>指定伙伴查看；需共同修改时再给编辑权限<\/td><\/tr><\/tbody><\/table><\/div><h2>分享纪要：五步检查<\/h2><ol><li style=\"margin:16px 0\">打开文档右上角<b>分享<\/b>。<\/li><li style=\"margin:16px 0\">核对现有协作者和链接访问范围。<\/li><li style=\"margin:16px 0\">添加指定伙伴，选择所需权限。<\/li><li style=\"margin:16px 0\">检查是否允许组织外访问；组织禁止时联系管理员。<\/li><li style=\"margin:16px 0\">请伙伴用自己的账号验证能否打开。自己的账号能打开不能代表对方能打开。<\/li><\/ol><p>妙记也在自己的分享面板里单独检查。线下面谈或微信通话生成的妙记同样需要设置访问范围。<\/p><div class=\"notice\">知道链接不等于有权限。撤销访问不会自动删除对方已下载的副本。合作结束后检查不再需要的访问权限。<\/div><div class=\"notearea\"><label class=\"field\" for=\"note7\">记下一条要点或你的实操结果<\/label><textarea id=\"note7\" data-note=\"note7\" placeholder=\"只填写练习信息，不放真实敏感资料\"><\/textarea><div class=\"savehint\">仅本机保存，可导出；不会自动提交。<\/div><\/div>"}, {"short": "独立实操", "title": "把一次沟通，<br>完整收尾。", "desc": "用模拟材料练一遍，再处理一次变更。", "time": "20分钟", "body": "<h2>交付一个小型成果包<\/h2><ol><li style=\"margin:16px 0\">创建测试日程，写好议程、资料和会议链接。只邀请知情练习同伴。<\/li><li style=\"margin:16px 0\">练习一次飞书会议云录制；再做一次非会议的<b>录音转写<\/b>，确认双方声音都清楚。<\/li><li style=\"margin:16px 0\">找到妙记，核对一处人名、日期或数字；用本课模拟转写继续练习。<\/li><li style=\"margin:16px 0\">在豆包工作中生成纪要、行动表、跟进消息草稿，打开检查。<\/li><li style=\"margin:16px 0\">设置纪要和妙记各自的访问范围，为一项已确认行动创建任务并关联纪要。<\/li><\/ol><p>当前账号不支持的操作可以用模拟材料继续学习，但须标记为“尚未实操”，不计作已经掌握。<\/p><h2>再处理一条新消息<\/h2><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">模拟变更<\/span><button class=\"copy\" data-copy=\"change\">复制<\/button><\/div><pre id=\"change\">教学模拟｜11月25日补充消息\n双方确认：活动改定为12月5日14:00；陈悦确认两位嘉宾均可参加。\n小林：议程初稿已交付，链接为[议程初稿链接]。\n报名页负责人和截止时间仍未确定。\n任务：更新纪要及行动表；不要把嘉宾意向确认写成活动已举办。<\/pre><\/div><button class=\"btn secondary small\" data-download=\"change\">下载变更材料<\/button><details><summary>完成后再看检查要点<\/summary><p>日期更新为12月5日14:00；嘉宾意向已确认，议程已提交并有链接；报名页分工与期限仍待确认。同步纪要、相关日程和任务，保留变更依据。<\/p><\/details><h2>交付前检查<\/h2><ul><li>伙伴能进入会议、打开材料。<\/li><li>录音两边清楚，关键结论能回查。<\/li><li>决定与待确认事项分开，行动有负责人和期限。<\/li><li>内部材料未进入对外成果。<\/li><li>文件可编辑，权限正确，消息仍是练习草稿。<\/li><\/ul><button class=\"btn secondary\" data-export=\"notes\">导出实操笔记<\/button><div class=\"notearea\"><label class=\"field\" for=\"note8\">记下一条要点或你的实操结果<\/label><textarea id=\"note8\" data-note=\"note8\" placeholder=\"只填写练习信息，不放真实敏感资料\"><\/textarea><div class=\"savehint\">仅本机保存，可导出；不会自动提交。<\/div><\/div><h2>从会议纪要进入团队会话<\/h2><p>保留已确认的决定、待确认的问题和资料权限。下一部分用这份纪要理解同事如何在龙喵里共同推进活动。豆包工作是本课示范，日常使用龙喵无需额外配置它。<\/p><a class=\"btn secondary\" href=\"lesson03.html#home\">第四课 · 认识龙喵 →<\/a>"}], "quiz": [{"q": "已发出日历邀请，下一步怎么做？", "opts": ["默认对方参加", "检查接受状态，必要时确认", "再建一份相同日程"], "a": 1, "why": "邀请已发出与参会已确认是两种状态。", "lesson": 1, "dim": "会前准备"}, {"q": "伙伴能加入会议，但打不开方案，先查什么？", "opts": ["文档访问及外部分享权限", "会议音量", "妙记标题"], "a": 0, "why": "入会与文档访问分别受控。", "lesson": 7, "dim": "权限"}, {"q": "线下面谈想留记录，怎样做？", "opts": ["只能手写", "必须先建飞书会议", "告知并取得同意后，开始录音转写，试录核对"], "a": 2, "why": "不必限定在线上会议；录音前要说明用途与范围，并确认收音。", "lesson": 3, "dim": "录音转写"}, {"q": "电脑戴耳机打微信电话，试录只有自己的声音，怎么办？", "opts": ["继续录，AI会补全", "检查系统音频采集与授权，调整后再次双向试录", "只提高麦克风音量即可保证录全"], "a": 1, "why": "麦克风可能收不到耳机里的声音。确认系统音频能力，或采用合适的替代收音方式，必须实测。", "lesson": 3, "dim": "录音转写"}, {"q": "点击停止录音后，怎样确认有可用妙记？", "opts": ["等上传转写完成，打开回放并核对关键内容", "退出软件就算成功", "只看文件名"], "a": 0, "why": "录音结束、上传完成、转写完成和内容可用需要区分。", "lesson": 3, "dim": "录音转写"}, {"q": "“可以考虑12月4日”，纪要应写成？", "opts": ["已定12月4日", "候选日期，待确认", "取消活动"], "a": 1, "why": "候选时间不能写成正式安排。", "lesson": 4, "dim": "结论核验"}, {"q": "报名页未说负责人或期限，应如何整理？", "opts": ["分给发言最多的人", "默认明天完成", "两项均标注待确认"], "a": 2, "why": "缺失信息要明确标注，不能代替当事人承诺。", "lesson": 6, "dim": "结论核验"}, {"q": "豆包工作打不开飞书资料链接，应怎样处理？", "opts": ["把文档设为公开", "先核对身份和原权限，允许时提供必要文本或文件", "反复提交就会获得权限"], "a": 1, "why": "工具不自动获得全部企业资料权限，不扩大公开范围来解决读取问题。", "lesson": 5, "dim": "豆包工作"}, {"q": "豆包工作显示任务完成，接下来应该？", "opts": ["打开文件核对内容、可编辑性和分享范围", "直接转发给所有伙伴", "删掉原始记录"], "a": 0, "why": "生成完成不等于成果核验通过。", "lesson": 5, "dim": "豆包工作"}, {"q": "撤销伙伴的文档访问权限意味着？", "opts": ["已下载副本同时删除", "所有记录自动销毁", "后续访问受限，已下载副本不保证收回"], "a": 2, "why": "访问控制不能自动收回已经下载的副本。", "lesson": 7, "dim": "权限"}], "home": "<div class=\"crumb\">模数学习室 / 第三课 · 原编号02<\/div><section class=\"hero\"><div><div class=\"eyebrow\">Turn conversations into action<\/div><h1>聊得清楚，<br>事情有着落。<\/h1><p class=\"lead\">用飞书与豆包工作完成一次协作。<br>从日历邀约、会议和录音转写，<br>到纪要、行动与权限设置。<\/p><div class=\"meta\"><span>全员必修<\/span><span>阅读＋实操约60–80分钟<\/span><\/div><div class=\"row\"><a class=\"btn\" id=\"start\" href=\"#lesson1\">开始学习 →<\/a><a class=\"btn secondary\" href=\"#lesson3\">直接学录音转写<\/a><\/div><\/div><svg class=\"hero-art\" viewBox=\"0 0 400 390\" role=\"img\" aria-label=\"沟通记录与行动清单\"><g fill=\"#fffdf8\" stroke=\"#555249\" stroke-width=\"1.7\"><rect x=\"40\" y=\"70\" width=\"220\" height=\"150\" rx=\"12\"/><path d=\"M70 220v24l35-24\"/><rect x=\"178\" y=\"170\" width=\"174\" height=\"162\" rx=\"6\"/><rect x=\"126\" y=\"100\" width=\"40\" height=\"64\" rx=\"20\"/><\/g><g fill=\"none\" stroke=\"#aa4c32\" stroke-width=\"2\"><path d=\"M112 140v8a34 34 0 0068 0v-8M146 182v18M130 200h32M198 202l7 7 12-17M198 244l7 7 12-17M198 286l7 7 12-17\"/><\/g><g stroke=\"#77746a\"><path d=\"M230 204h98M230 246h98M230 288h98\"/><\/g><text x=\"200\" y=\"368\" text-anchor=\"middle\" fill=\"#77746a\" font-size=\"11\" letter-spacing=\"2\">MEET · RECORD · FOLLOW UP<\/text><\/svg><\/section><section class=\"band\"><div><span class=\"eyebrow\">学完能做<\/span><p class=\"caption\">第三课 / Course 02<\/p><\/div><div><blockquote>沟通有记录，<br>结论有依据，行动有人接。<\/blockquote><p>飞书组织协作，妙记保留原话，豆包工作整理成果；最终由你核对。<\/p><\/div><\/section><div class=\"cards\"><a class=\"card\" href=\"#lesson1\"><span class=\"eyebrow\">01<\/span><h3>日历邀约 →<\/h3><p>让伙伴知道何时参加、讨论什么、从哪里进入。<\/p><\/a><a class=\"card\" href=\"#lesson2\"><span class=\"eyebrow\">02<\/span><h3>会议与云录制 →<\/h3><p>飞书线上会议使用云录制；其他通话和面谈见下一单元。<\/p><\/a><a class=\"card\" href=\"#lesson3\"><span class=\"eyebrow\">03<\/span><h3>通话与线下录音 →<\/h3><p>电脑微信通话、线下面谈，都可以练习“开始录音转写”。先确认收音，再正式记录。<\/p><\/a><a class=\"card\" href=\"#lesson4\"><span class=\"eyebrow\">04<\/span><h3>核对妙记 →<\/h3><p>妙记保留过程，纪要提炼经过核对的决定和行动。<\/p><\/a><a class=\"card\" href=\"#lesson5\"><span class=\"eyebrow\">05<\/span><h3>交给豆包工作 →<\/h3><p>使用“豆包工作”，按任务生成文档和表格，再打开检查。<\/p><\/a><a class=\"card\" href=\"#lesson6\"><span class=\"eyebrow\">06<\/span><h3>纪要与行动 →<\/h3><p>对照参考检查，不把讨论写成承诺，不替别人分配未确认的工作。<\/p><\/a><a class=\"card\" href=\"#lesson7\"><span class=\"eyebrow\">07<\/span><h3>分享与权限 →<\/h3><p>能入会，不代表能看妙记；能看纪要，也不代表能编辑。<\/p><\/a><a class=\"card\" href=\"#lesson8\"><span class=\"eyebrow\">08<\/span><h3>独立实操 →<\/h3><p>用模拟材料练一遍，再处理一次变更。<\/p><\/a><\/div><div class=\"notice\">全课材料均为教学模拟。页面不调用AI、不上传笔记、不发送消息。学习记录只尝试保存在本机；隔离预览中建议及时导出。<\/div><p><a href=\"#framework\">本课大纲 →<\/a>　<a href=\"https://binllm18.github.io/ai-office-course/\" target=\"_blank\" rel=\"noopener noreferrer\">已发布的前两课 ↗<\/a><\/p><div class=\"row\"><a class=\"btn secondary\" href=\"lesson03.html#home\">第四课 · 认识龙喵 →<\/a><\/div>", "framework": "<article class=\"lesson\"><div class=\"eyebrow\">Course 02 / 第三课<\/div><h1>从约会议，<br>到工作落地。<\/h1><p class=\"intro\">线上会议、微信通话、线下面谈，都能留下可核对的记录，再用豆包工作整理成果。<\/p><div class=\"table-wrap\" role=\"region\" aria-label=\"操作对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>单元<\/th><th>学会什么<\/th><\/tr><\/thead><tbody><tr><td><a href=\"#lesson1\">01 · 日历邀约<\/a><\/td><td>让伙伴知道何时参加、讨论什么、从哪里进入。<\/td><\/tr><tr><td><a href=\"#lesson2\">02 · 会议与云录制<\/a><\/td><td>飞书线上会议使用云录制；其他通话和面谈见下一单元。<\/td><\/tr><tr><td><a href=\"#lesson3\">03 · 通话与线下录音<\/a><\/td><td>电脑微信通话、线下面谈，都可以练习“开始录音转写”。先确认收音，再正式记录。<\/td><\/tr><tr><td><a href=\"#lesson4\">04 · 核对妙记<\/a><\/td><td>妙记保留过程，纪要提炼经过核对的决定和行动。<\/td><\/tr><tr><td><a href=\"#lesson5\">05 · 交给豆包工作<\/a><\/td><td>使用“豆包工作”，按任务生成文档和表格，再打开检查。<\/td><\/tr><tr><td><a href=\"#lesson6\">06 · 纪要与行动<\/a><\/td><td>对照参考检查，不把讨论写成承诺，不替别人分配未确认的工作。<\/td><\/tr><tr><td><a href=\"#lesson7\">07 · 分享与权限<\/a><\/td><td>能入会，不代表能看妙记；能看纪要，也不代表能编辑。<\/td><\/tr><tr><td><a href=\"#lesson8\">08 · 独立实操<\/a><\/td><td>用模拟材料练一遍，再处理一次变更。<\/td><\/tr><\/tbody><\/table><\/div><h2>最终交付<\/h2><p>会议邀请、可核对的记录、会议纪要、行动清单和跟进消息草稿。阅读约15–20分钟，动手约45–60分钟；依熟练程度而异。<\/p><button class=\"btn secondary\" data-download=\"framework\">下载大纲<\/button><\/article>", "sources": "<article class=\"lesson\"><div class=\"eyebrow\">Sources & scope<\/div><h1>参考与说明<\/h1><p class=\"intro\">功能依当前客户端、操作系统、套餐与管理员设置而异。界面路径是操作指引，具体按钮以实际版本为准。<\/p><h2>官方参考<\/h2><ul><li><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.feishu.cn/content/article/7578773484596153570\">飞书妙记：录音、文件上传、导出与分享 ↗<\/a><\/li><li><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.feishu.cn/privacy?lang=zh\">飞书隐私政策：系统音频和麦克风授权 ↗<\/a><\/li><li><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.feishu.cn/hc/zh-CN/articles/360024861134\">创建日程 ↗<\/a><\/li><li><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.feishu.cn/hc/zh-CN/articles/360043230014\">会议录制 ↗<\/a><\/li><li><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.feishu.cn/hc/zh-CN/articles/821155971912\">妙记权限 ↗<\/a><\/li><li><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.feishu.cn/content/article/7677519271848610746\">豆包工作官方介绍 ↗<\/a><\/li><\/ul><h2>核验边界<\/h2><p>2026年11月18日：读取了妙记官方介绍，确认桌面端与移动端录音、文件上传及导出等能力。桌面“开始录音转写”具体入口及系统音频开关未在你的设备实测，因此课程要求先做双向试录。此前日历、会议与权限帮助中心正文抓取有限，部分依据官方搜索摘要。不存在已经验证所有账号都可用的保证。<\/p><h2>学习与记录<\/h2><p>暖白底色、侧栏目录与前两课一致。自包含HTML，无外部脚本、字体和统计追踪。只有主动打开来源链接时访问外网。笔记、进度和答案保存在当前浏览器，受限时回退内存；请及时导出。没有统一成绩库或自动收卷。<\/p><p>复制、下载在隔离预览里可能受限，可下载HTML后用浏览器打开。10题自测每题10分，80分为学习参考线，不替代实操。课程编排未做真实学员计时。<\/p><p class=\"caption\">模数 CHRO · 第三课 v1.0 · 2026-11-18<\/p><\/article>", "materials": {"invite": "教学模拟｜时间均为2026年、北京时间\n主题：社区项目交流活动｜合作沟通\n时间：11月24日14:00—14:30\n目标：确认活动方向、双方分工与下一步\n议程：活动安排10分钟、分工15分钟、确认行动5分钟\n会前材料：[活动方案链接]\n入会方式：[飞书会议链接]", "transcript": "教学模拟｜11月24日合作会议｜时间均为2026年、北京时间\n[03:10] 小林：活动时间可以考虑12月4日下午，我还要确认场地。\n[04:05] 陈悦：我也要问两位分享嘉宾，今天先不定日期。\n[12:20] 小林：议程初稿我在11月25日17点前发给你。\n[13:00] 陈悦：我在11月26日12点前确认两位嘉宾的意向。\n[18:40] 小林：报名页需要制作，负责人我们会后再定。\n[25:10] 双方确认：先完成议程和嘉宾确认，再确定活动日期。", "internal": "教学模拟｜内部筹备备注，与对外材料分开保存\n预算上限为8000元，尚未批准，仅供内部讨论，不对外提供。", "recordcheck": "录音转写检查卡\n录前：告知用途和查看范围，取得同意；检查麦克风及必要系统音频权限。\n试录：双方各说一句，结束测试后回放，确认双方声音清楚。\n正式录音：开始录音转写，检查录音状态；重要结论口头复述。\n结束：停止并保存，等待上传和转写完成；命名为日期＋对象＋主题。\n核验：人名、数字、日期、决定、行动；核对访问和导出权限。", "change": "教学模拟｜11月25日补充消息\n双方确认：活动改定为12月5日14:00；陈悦确认两位嘉宾均可参加。\n小林：议程初稿已交付，链接为[议程初稿链接]。\n报名页负责人和截止时间仍未确定。\n任务：更新纪要及行动表；不要把嘉宾意向确认写成活动已举办。"}, "framework_md": "# 第三课｜用飞书与豆包工作完成一次线上协作\n\n原编号02 · 包含微信通话与线下面谈录音转写\n\n1. 日历邀约：让伙伴知道何时参加、讨论什么、从哪里进入。\n2. 会议与云录制：飞书线上会议使用云录制；其他通话和面谈见下一单元。\n3. 通话与线下录音：电脑微信通话、线下面谈，都可以练习“开始录音转写”。先确认收音，再正式记录。\n4. 核对妙记：妙记保留过程，纪要提炼经过核对的决定和行动。\n5. 交给豆包工作：使用“豆包工作”，按任务生成文档和表格，再打开检查。\n6. 纪要与行动：对照参考检查，不把讨论写成承诺，不替别人分配未确认的工作。\n7. 分享与权限：能入会，不代表能看妙记；能看纪要，也不代表能编辑。\n8. 独立实操：用模拟材料练一遍，再处理一次变更。"};</script><script>(()=>{
'use strict';
const {lessons:LESSONS,quiz:QUIZ,home:HOME,framework:FRAMEWORK,sources:SOURCES,materials:MATERIALS}=DATA;
const KEY='moshu-ai-office-02-v1';
const blank=()=>({done:[],notes:{},checks:[],answers:{},last:1});
let state=blank(),persistent=true,toastTimer;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&typeof raw==='object'){
state.done=Array.isArray(raw.done)?[...new Set(raw.done.filter(n=>Number.isInteger(n)&&n>=1&&n<=8))]:[];
state.notes=raw.notes&&typeof raw.notes==='object'&&!Array.isArray(raw.notes)?Object.fromEntries(Object.entries(raw.notes).filter(([k,v])=>typeof v==='string')):{};
state.checks=Array.isArray(raw.checks)?raw.checks.filter(n=>Number.isInteger(n)&&n>=0&&n<=3):[];
if(raw.answers&&typeof raw.answers==='object')Object.entries(raw.answers).forEach(([k,v])=>{if(/^\d+$/.test(k)&&+k<QUIZ.length&&Number.isInteger(v)&&v>=0&&v<QUIZ[+k].opts.length)state.answers[k]=v;});
state.last=Number.isInteger(raw.last)&&raw.last>=1&&raw.last<=8?raw.last:1;}
localStorage.setItem(KEY,JSON.stringify(state));}catch(e){persistent=false;}
const main=document.querySelector('main');
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){persistent=false;}document.querySelector('#storageNotice').classList.toggle('hidden',persistent);}
function toast(s){const el=document.querySelector('#toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),4000);}
function progress(){document.querySelector('#progress').value=state.done.length;document.querySelector('#progressLabel').textContent=`已学习 ${state.done.length} / 8 个单元`;document.querySelectorAll('[data-done]').forEach(el=>el.textContent=state.done.includes(+el.dataset.done)?'✓':'');}
function footer(){return '<footer><span>模数 OPC · AI办公能力课程</span><span>HTML v1.0 / 第三课沿用原编号02</span></footer>';}
function route(requested){
clearTimeout(toastTimer);document.querySelector('#toast').classList.add('hidden');
let id=typeof requested==='string'?requested:(location.hash.slice(1)||'home');if(id==='main'){main.focus();return;}
if(!/^(framework|home|sources|assessment|lesson[1-8])$/.test(id))id='framework';
document.body.classList.toggle('exam-mode',id==='assessment');document.querySelector('.layout').classList.remove('menu-open');document.querySelector('#menu').setAttribute('aria-expanded','false');
document.querySelectorAll('[data-nav]').forEach(el=>{const active=el.dataset.nav===id;el.classList.toggle('active',active);if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});
if(id==='framework')main.innerHTML=FRAMEWORK+footer();
else if(id==='home'){main.innerHTML=HOME+footer();if(state.done.length||Object.keys(state.notes).length){const a=document.querySelector('#start');a.href='#lesson'+state.last;a.textContent='继续上次学习 →';}}
else if(id==='sources')main.innerHTML=SOURCES+footer();
else if(id==='assessment'){main.innerHTML=exam()+footer();bindExam();}
else{const i=+id.slice(6),l=LESSONS[i-1];state.last=i;save();main.innerHTML=`<article class="lesson"><div class="crumb"><a href="#home">飞书与豆包工作</a> / ${String(i).padStart(2,'0')} / ${l.time}</div><div class="eyebrow">Unit ${String(i).padStart(2,'0')} of 08</div><h1>${l.title}</h1><p class="intro">${l.desc}</p>${l.body}<div class="bottom"><label class="complete"><input type="checkbox" id="complete" ${state.done.includes(i)?'checked':''}>已学完本单元（非验收成绩）</label><div class="row"><a class="btn secondary small" href="${i===1?'#home':'#lesson'+(i-1)}">← 上一页</a><a class="btn small" href="${i===8?'#assessment':'#lesson'+(i+1)}">${i===8?'独立自测 →':'下一单元 →'}</a></div></div></article>`+footer();
document.querySelector('#complete').onchange=e=>{state.done=state.done.filter(n=>n!==i);if(e.target.checked)state.done.push(i);save();progress();};}
main.querySelectorAll('[data-note]').forEach(el=>{el.value=state.notes[el.dataset.note]||'';el.oninput=()=>{state.notes[el.dataset.note]=el.value;save();};});
main.querySelectorAll('[data-check]').forEach(el=>{el.checked=state.checks.includes(+el.dataset.check);el.onchange=()=>{state.checks=state.checks.filter(n=>n!==+el.dataset.check);if(el.checked)state.checks.push(+el.dataset.check);save();};});

main.dataset.route=id;progress();document.querySelector('#storageNotice').classList.toggle('hidden',persistent);window.scrollTo({top:0,left:0,behavior:'instant'});main.focus({preventScroll:true});
}
async function copy(text,button){try{await Promise.race([navigator.clipboard.writeText(text),new Promise((_,reject)=>setTimeout(()=>reject(Error('clipboard timeout')),1200))]);}catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.top='0';document.body.append(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();if(!ok){const node=document.getElementById(button.dataset.copy),range=document.createRange();range.selectNodeContents(node);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);toast('已选中原文，请手动复制。');return;}}
toast('已复制。请核对内容后粘贴到你的AI工具。');}
function download(name,text,type='text/plain;charset=utf-8'){try{const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('已请求下载；若预览阻止下载，请用浏览器打开HTML后操作。');}catch(e){toast('当前预览不支持下载，请下载HTML后在浏览器打开。');}}
const noteLabels={"note1": "日历邀约", "note2": "会议与云录制", "note3": "通话与线下录音", "note4": "核对妙记", "note5": "交给豆包工作", "note6": "纪要与行动", "note7": "分享与权限", "note8": "独立实操"};
function exportNotes(){download('飞书与豆包工作_我的学习笔记.md','# 飞书与豆包工作｜我的学习笔记\n\n导出时间：'+new Date().toLocaleString('zh-CN')+'\n本机学习记录，未提交，非能力通过凭据。\n已标记学习：'+state.done.length+'/8个单元。\n\n'+Object.entries(noteLabels).map(([k,t])=>'## '+t+'\n\n'+(state.notes[k]||'（未填写）')).join('\n\n'));}
function exam(){return `<article class="lesson exam"><div class="crumb"><a href="#home">← 返回第三课</a> / 独立知识自测</div><div class="eyebrow">Check your understanding</div><h1>懂方法，也会判断。</h1><p class="intro">10道情境题，每题10分，约8分钟。80分为知识自测参考线，允许回看课程；通过后仍需完成独立实操。</p><p class="caption">本机自测 · 不上传 · 不生成厂商认证 · 页面包含解析，不作为保密正式考卷</p><form id="quizForm">${QUIZ.map((q,i)=>`<section class="question" id="q${i}"><h3 id="qtitle${i}">${String(i+1).padStart(2,'0')} / ${q.q}</h3><fieldset aria-labelledby="qtitle${i}" style="border:0;padding:0;margin:0"><legend class="caption">单选 · 10分</legend>${q.opts.map((t,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${state.answers[i]===j?'checked':''}><span>${t}</span></label>`).join('')}</fieldset><div class="review" id="review${i}"></div></section>`).join('')}<p id="examAlert" role="alert"></p><div class="row"><button type="submit" class="btn">查看自测结果 →</button><button type="button" id="retry" class="btn secondary">重新作答</button></div></form><div id="result" tabindex="-1" aria-live="polite"></div><div class="notice">本卷用于理解诊断。实操请保留会议成果包和双向收音检查记录，由带教同事结合成果判断。</div></article>`;}
function resultData(){const dims={};let score=0;const wrong=[];QUIZ.forEach((q,i)=>{if(!dims[q.dim])dims[q.dim]={correct:0,total:0};dims[q.dim].total++;if(state.answers[i]===q.a){score+=10;dims[q.dim].correct++;}else wrong.push(i+1);});return {score,dims,wrong};}
function bindExam(){document.querySelectorAll('#quizForm input').forEach(el=>el.onchange=()=>{state.answers[+el.name.slice(1)]=+el.value;save();document.querySelector('#result').innerHTML='';document.querySelectorAll('.review').forEach(r=>r.innerHTML='');document.querySelector('#examAlert').textContent='';});
document.querySelector('#quizForm').onsubmit=e=>{e.preventDefault();const missing=QUIZ.map((q,i)=>i).filter(i=>state.answers[i]===undefined);if(missing.length){document.querySelector('#examAlert').textContent='还有 '+missing.length+' 题未作答，请先完成。';document.querySelector(`[name="q${missing[0]}"]`).focus();return;}
const {score,dims,wrong}=resultData();QUIZ.forEach((q,i)=>{document.querySelector('#review'+i).innerHTML=`<div class="feedback"><b>${state.answers[i]===q.a?'回答正确':'需要再看一看'}</b> · 正确选项：${q.opts[q.a]}<p>${q.why}</p><a href="#lesson${q.lesson}">回到第${q.lesson}单元复习 →</a></div>`;});
document.querySelector('#result').innerHTML=`<div class="result"><span class="label">本次知识自测</span><strong>${score}</strong> / 100<p>${score>=80?'已达到自测参考线。下一步：完成会议闭环与录音转写练习。':'建议回看错题对应单元，再重做一次。'}</p><div class="flow">${Object.entries(dims).map(([k,v])=>`<div><b>${k}</b>${v.correct} / ${v.total}题正确</div>`).join('')}</div><p class="smalltext">分项题数有限，仅用于定位知识点，不能直接作为能力评级。</p><div class="row"><button type="button" class="btn secondary small" id="exportScore">导出本次结果</button><a href="#lesson8">查看独立作业 →</a></div><p class="caption">成绩未上传；学习完成和实操通过分别判断。</p></div>`;
document.querySelector('#exportScore').onclick=()=>download('飞书与豆包工作_知识自测.json',JSON.stringify({course:'飞书与豆包工作',version:'1.0',at:new Date().toISOString(),score,dims,wrongQuestions:wrong,answers:state.answers,status:'本机知识自测；未提交；非实操认证'},null,2),'application/json;charset=utf-8');document.querySelector('#result').focus();};
document.querySelector('#retry').onclick=()=>{state.answers={};save();route('assessment');toast('已清空答案，可以重新作答。');};}
document.addEventListener('click',e=>{const link=e.target.closest('a[href^="#"]');if(link){e.preventDefault();const hash=link.getAttribute('href');try{history.pushState(null,'',hash);}catch(err){}route(hash.slice(1));return;}const copyBtn=e.target.closest('[data-copy]');if(copyBtn){const node=document.getElementById(copyBtn.dataset.copy);if(node)copy(node.innerText,copyBtn);}const d=e.target.closest('[data-download]');if(d){const key=d.dataset.download;download(key==='framework'?'AI办公能力_课程框架.md':'飞书与豆包工作_'+key+'.txt',key==='framework'?DATA.framework_md:MATERIALS[key]);}if(e.target.closest('[data-export="notes"]'))exportNotes();});
document.querySelector('#menu').onclick=()=>{const open=document.querySelector('.layout').classList.toggle('menu-open');document.querySelector('#menu').setAttribute('aria-expanded',String(open));};
document.querySelector('#reset').onclick=()=>{if(confirm('清除本浏览器中本课的进度、笔记与自测草稿？建议先导出。')){const active=main.dataset.route;state=blank();save();route(active);toast('已清除本课本机记录。');}};
window.addEventListener('hashchange',route);window.addEventListener('popstate',route);route();
})();
</script></body></html>
