#fieldResult{margin-top:20px}#fieldResult:empty{display:none}.outline-list{padding-left:22px}.outline-list li{margin:12px 0}.lesson details{margin:24px 0}.lesson h2{margin-top:36px}pre{white-space:pre-wrap;overflow-wrap:anywhere} .intro{margin-bottom:30px}</style></head><body><a href="#main" class="skip">跳到正文</a><header><a class="brand" href="#home">模数 · 学习室<em>WORKING WITH AI</em></a><div class="toplinks"><a href="#framework" class="reference">本课大纲</a><a class="pill" href="#assessment">独立自测 ↗</a><button class="menu" id="menu" aria-controls="sidebar" aria-expanded="false">目录</button></div></header><div id="storageNotice" class="storage-notice hidden" role="status">当前环境无法长期保存记录；仍可学习和自测。关闭前请导出笔记。</div><div class="layout"><aside id="sidebar"><div class="eyebrow">全员必修 / Course 03</div><div class="side-title">第四课 · 认识龙喵：原理与基本功能</div><nav class="nav" aria-label="课程目录"><a href="./#framework">↗ 全部课程</a><a href="lesson02.html#home">第三课 · 飞书与豆包工作</a><a href="#home" data-nav="home"><span class="num">○</span>第四课导览</a><a href="#framework" data-nav="framework"><span class="num">↗</span>本课大纲</a><a href="#lesson1" data-nav="lesson1"><span class="num">01</span>龙喵与团队工作<span class="done" data-done="1"></span></a><a href="#lesson2" data-nav="lesson2"><span class="num">02</span>原理与上下文<span class="done" data-done="2"></span></a><a href="#lesson3" data-nav="lesson3"><span class="num">03</span>开始一件工作<span class="done" data-done="3"></span></a><a href="#lesson4" data-nav="lesson4"><span class="num">04</span>推进与协作<span class="done" data-done="4"></span></a><a href="#lesson5" data-nav="lesson5"><span class="num">05</span>验收与采用<span class="done" data-done="5"></span></a><a href="#lesson6" data-nav="lesson6"><span class="num">06</span>复用与自动化<span class="done" data-done="6"></span></a></nav><div class="progress-box"><div class="caption" id="progressLabel">已学习 0 / 6 个单元</div><progress id="progress" max="6" value="0" aria-label="自行标记的学习进度"></progress><p>学习进度自行标记，<br>理解与实操分别判断。</p></div><div class="sidefoot"><button class="textbtn" data-export="notes">导出本课笔记</button><a href="#sources" data-nav="sources">教学参考与说明</a><button class="textbtn" id="reset">清除本课本机记录</button></div></aside><main id="main" tabindex="-1"></main></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div><noscript><p style="padding:30px">请启用JavaScript以使用课程目录和学习交互。</p></noscript><script>const DATA={"lessons": [{"short": "龙喵与团队工作", "title": "个人做得快，<br>团队也要接得住。", "desc": "理解龙喵怎样完成任务并承接团队上下文；产品对比仅帮助理解定位。", "time": "10分钟", "body": "<h2>从分享结果，到一起参与对话<\/h2><p>沿用上节课的活动纪要：运营在龙喵会话里请它拟方案，预算同事看到讨论后直接补充费用上限，现场负责人也在同一会话说明场地限制。龙喵据此修改，全组能看到改了哪一版、为什么改。参与者无需先向发起人索取聊天截图。<\/p><p>和豆包工作、WorkBuddy 等产品中常见的个人对话后再分享相比，龙喵在我们团队的日常用法强调<b>共同可见、直接参与、接续推进<\/b>。可见范围取决于权限；其他产品也可能提供企业共享功能。团队通常在龙喵内即可完成全流程。<\/p><h2>为什么多一个AI工具，工作还会卡住？<\/h2><p>你用AI完成了一份活动方案。同事要接着做物料，却找不到确认过的日期；另一位同事拿到旧版本，又重新问了一遍背景。每个人都做得很快，团队仍在反复转述。<\/p><p>团队要解决的还有：<b>背景留在哪里、谁接下一步、哪版正式采用。<\/b>模数围绕龙喵建立工作台，把这些信息留在同一件工作上。<\/p><div class=\"table-wrap\" role=\"region\" aria-label=\"知识对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>能力层次<\/th><th>解决的问题<\/th><th>理解方式<\/th><\/tr><\/thead><tbody><tr><td>Work Agent<\/td><td>把当前任务完成<\/td><td>根据材料做方案、表格或物料<\/td><\/tr><tr><td>Personal Agent<\/td><td>长期服务一个人<\/td><td>记住个人偏好，持续接着办事<\/td><\/tr><tr><td>Team Agent<\/td><td>支持组织中的协作<\/td><td>按角色与授权使用工作上下文，让人能接手<\/td><\/tr><\/tbody><\/table><\/div><p>三层可以叠加：团队Agent执行一项任务时，也在发挥Work Agent的能力。产品不会因为支持某一层，就只属于那一层。<\/p><h2>龙喵、小模和工作台分别做什么？<\/h2><div class=\"table-wrap\" role=\"region\" aria-label=\"知识对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>角色<\/th><th>在模数实践中的用途<\/th><\/tr><\/thead><tbody><tr><td>龙喵<\/td><td>通用工作Agent，参与分析、制作和修改成果<\/td><\/tr><tr><td>工作台<\/td><td>承载工作、会话、材料、成果与状态<\/td><\/tr><tr><td>小模<\/td><td>连接飞书里的群聊、私聊与工作协作<\/td><\/tr><tr><td>同频与专职助手<\/td><td>分别衔接任务通知反馈、入驻等特定业务流程<\/td><\/tr><\/tbody><\/table><\/div><p>个人域、组织域、决策域按授权连通。与当前工作无关的个人资料不必搬进组织；需要协作的背景，要让获准参与者能够读到。<\/p><h2>与豆包工作、WorkBuddy有什么区别？<\/h2><div class=\"notice\">三者能力有重叠，也都具有团队使用或协作能力。下表比较使用重点；“龙喵”按龙喵＋模数工作台及配套机制理解，WorkBuddy团队能力参考企业版。<\/div><div class=\"table-wrap\" role=\"region\" aria-label=\"知识对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>维度<\/th><th>龙喵＋模数工作台<\/th><th>豆包工作<\/th><th>WorkBuddy<\/th><\/tr><\/thead><tbody><tr><td>工作重点<\/td><td>承接模数已有业务、责任与经验<\/td><td>结合飞书资料，完成办公任务和协作成果<\/td><td>通用执行工作台，结合本地与云端任务<\/td><\/tr><tr><td>上下文位置<\/td><td>一件Work中的目标、会话、决定与采用记录<\/td><td>用户提供的材料和权限内的飞书信息<\/td><td>本地工作空间、项目资料与连接器<\/td><\/tr><tr><td>协作方式<\/td><td>围绕同一件事推进与交接，衔接配套助手<\/td><td>依托飞书资料和成果协作<\/td><td>企业版以项目、任务共享资料和工作规则<\/td><\/tr><tr><td>复用重点<\/td><td>记录采用理由，整理组织知识和Skill<\/td><td>复用企业知识、技能和工作伙伴<\/td><td>复用项目资料、指令和Skill<\/td><\/tr><\/tbody><\/table><\/div><h2>用同一场活动理解差异<\/h2><p><b>豆包工作：<\/b>围绕飞书里的方案与会议记录，制作筹备文档、表格或PPT。<br><b>WorkBuddy：<\/b>在项目中组织材料和任务，按需处理本地文件、调用工具。<br><b>龙喵工作台：<\/b>直接读取有权访问的活动材料、分析方案、制作文档和表格、修改物料，并把负责人、采用版本和下一步持续留在同一件Work里。<\/p><p>三者都有任务执行能力，不能把龙喵理解成只负责收集其他工具产物的看板。龙喵既参与执行，也把执行接入模数的业务上下文与工作机制；其他平台经配置也可能支持相似流程。<\/p><div class=\"notice\"><b>我们的日常工作方式：<\/b>通常直接在龙喵中完成资料读取、分析、制作、修改、核验与归档，无需再配合豆包工作或WorkBuddy。本节提到另外两款产品，只为借熟悉的例子理解龙喵；不要求安装、切换或组合使用。只有出现明确的能力、权限或运行环境缺口时，才评估补充方案。<\/div><details><summary>比较的依据和边界<\/summary><p>豆包工作、WorkBuddy定位沿用本轮之前核对的官方介绍；龙喵依据模数文章和周会转写。未做三款产品同题性能实测，不据此判断谁更聪明或速度更快。套餐、权限和具体功能以当前账号为准。<\/p><\/details><h2>一件工作里，龙喵究竟接住了什么？<\/h2><p>以“社区活动筹备”为例，目标是让参与者按正确的信息到场。写方案只是其中一次执行。方案通过后，还有物料、通知、现场准备与复盘。若每次都重新讲背景，日期、对象和采用版本就容易断开。<\/p><div class=\"table-wrap\" role=\"region\" aria-label=\"知识对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>环节<\/th><th>龙喵可以推进的内容<\/th><th>人需要交清或判断的内容<\/th><\/tr><\/thead><tbody><tr><td>准备<\/td><td>读取材料、查找历史经验、列出缺口<\/td><td>活动目标、服务对象、硬性约束<\/td><\/tr><tr><td>制作<\/td><td>起草方案、做表格和物料、根据反馈修改<\/td><td>方向是否合适，哪些信息已确认<\/td><\/tr><tr><td>协作<\/td><td>整理任务依赖、交接材料、在获准范围内衔接后续<\/td><td>责任归属、对外承诺、重要取舍<\/td><\/tr><tr><td>验收<\/td><td>检查一致性、提供文件和执行凭据、整理版本<\/td><td>是否正式采用，业务条件是否满足<\/td><\/tr><tr><td>复用<\/td><td>提炼适用条件、失败原因与可复用步骤<\/td><td>经验是否可靠，哪些属于本次特例<\/td><\/tr><\/tbody><\/table><\/div><p>这五个环节可以在龙喵和对应工作中连续推进。写稿、做表格、做PPT都属于执行能力；工作台再让这些执行围绕同一目标积累。单次输出质量与整件事能否持续接续，应分别检查。<\/p><h2>为什么团队有了AI，仍会出现“人肉代理”？<\/h2><p>同事A把结果发群里，同事B复制给自己的AI，同事C再问为什么这样定。传过去的常常只有文件，缺了来源、约束和选择理由。解决这类问题，需要把<strong>关键结果与形成结果的理由<\/strong>一起留在工作中。<\/p><div class=\"notice\"><b>一个检验方法：<\/b>假设明天换人接手，对方能否直接找到“目标是什么、做到哪一步、采用哪一版、还差谁判断”？能找到这些，团队协作才真正接上。<\/div><h3>在龙喵中可以这样开始<\/h3><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可以这样说 · 教学示例<\/span><button class=\"copy\" data-copy=\"wholework\">复制<\/button><\/div><pre id=\"wholework\">我们要筹备一场社区交流活动。请在这件工作中读取已有方案和会议记录，先整理目标、已确认条件、未决问题和推进顺序，再开始制作筹备清单。后续的方案与物料都沿用这里确认的口径，阶段结果请关联回这件工作。先做到内部审核，不对外发送。<\/pre><\/div><div class=\"notearea\"><label class=\"field\" for=\"note1\">用自己的话记下一条要点<\/label><textarea id=\"note1\" data-note=\"note1\" placeholder=\"只记录学习要点，不填写真实敏感信息\"><\/textarea><div class=\"savehint\">仅本机保存，可导出，不会自动提交。<\/div><\/div>"}, {"short": "原理与上下文", "title": "让AI理解目标，<br>也能接着往下做。", "desc": "分清模型、工具、Skill，以及工作、会话和成果。", "time": "11分钟", "body": "<h2>从要求到成果，发生了什么？<\/h2><div class=\"flow\"><div><b>理解<\/b>目标与材料<\/div><div><b>执行<\/b>调用工具<\/div><div><b>检查<\/b>核对结果<\/div><div><b>调整<\/b>接收反馈<\/div><\/div><div class=\"table-wrap\" role=\"region\" aria-label=\"知识对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>组成<\/th><th>通俗理解<\/th><th>不要误解<\/th><\/tr><\/thead><tbody><tr><td>模型<\/td><td>理解要求，推理和判断下一步<\/td><td>理解正确仍需检查<\/td><\/tr><tr><td>工具<\/td><td>实际读文件、做表格、生成文件或执行获准操作<\/td><td>说“已经做了”要有实际结果<\/td><\/tr><tr><td>Skill<\/td><td>可复用的方法、约束与经验<\/td><td>需要结合本次情况使用<\/td><\/tr><tr><td>上下文<\/td><td>目标、材料、决定及理由、当前状态<\/td><td>不等于把所有资料都塞进对话<\/td><\/tr><\/tbody><\/table><\/div><h2>会话可以有多个，事仍是同一件<\/h2><div class=\"table-wrap\" role=\"region\" aria-label=\"知识对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>对象<\/th><th>活动筹备中的例子<\/th><\/tr><\/thead><tbody><tr><td>工作 Work<\/td><td>“11月社区交流活动筹备”这件事<\/td><\/tr><tr><td>会话 Session<\/td><td>主会话讨论方案，子会话处理物料<\/td><\/tr><tr><td>成果<\/td><td>方案文档、预算表、海报文件等实际交付物<\/td><\/tr><\/tbody><\/table><\/div><p>会话用来讨论和执行，Work承接整件事。不要把每条补充要求都当成一个新工作，也不要把互不相干的工作长期堆在同一个会话里。<\/p><h2>交给AI的背景，至少包含这些<\/h2><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可以这样说 · 教学示例<\/span><button class=\"copy\" data-copy=\"context\">复制<\/button><\/div><pre id=\"context\">工作上下文卡\n工作名称：\n目标与交付物：\n负责人和截止时间：\n材料链接及读取情况：\n已确认决定与理由：\n采用版本及链接：\n待确认事项：\n下一步及负责人：\n只填当前工作需要的信息，未知项明确写待确认。<\/pre><\/div><button class=\"btn secondary small\" data-download=\"context\">下载上下文卡<\/button><details><summary>为什么“决定的理由”也要留下？<\/summary><p>只写“用第二版”，接手者仍不知道为什么。写成“采用第二版：已修正日期，并删去未确认的嘉宾信息”，下次修改时就能保留这些约束。<\/p><\/details><div class=\"notice\">Agent应推进已明确委托的任务。遇到影响目标、授权或重大取舍的问题，由有权人判断，并把结论和理由写回工作。<\/div><h2>理解、执行、记忆，为什么要分开看？<\/h2><p>模型能根据当前可见的信息判断下一步；工具把判断变成实际读取、计算或写入；保存在工作或知识中的内容，则可能供后续检索。三者相互配合，但任何一环都可能缺失。流畅的答复不能证明文件写入成功，资料已经保存也不能证明每个新会话都读过它。<\/p><div class=\"table-wrap\" role=\"region\" aria-label=\"知识对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>常见现象<\/th><th>可能缺在哪一层<\/th><th>应补的证据或动作<\/th><\/tr><\/thead><tbody><tr><td>回答很完整，却给不出文件<\/td><td>执行结果尚未落地<\/td><td>索取实际文件或链接并打开检查<\/td><\/tr><tr><td>沿用上次活动的日期<\/td><td>历史信息被当成当前事实<\/td><td>指出当前来源、核验日期与失效旧值<\/td><\/tr><tr><td>子会话仍用旧预算<\/td><td>新决定没有进入该会话可用上下文<\/td><td>把生效决定、关联版本和影响范围补进去<\/td><\/tr><tr><td>说“我记住了”，换会话又遗漏<\/td><td>只留在当前对话，未形成可检索记录<\/td><td>明确保存位置；新会话开始时核对读取情况<\/td><\/tr><\/tbody><\/table><\/div><h2>把上下文分成三层，比整包塞资料更有效<\/h2><ul><li><b>相对稳定的背景：<\/b>受众、品牌表达、已确认流程。标注适用范围，变化后更新。<\/li><li><b>当前工作的事实：<\/b>本次目标、预算、日期、负责人和材料。优先用本次已确认来源，避免历史经验覆盖当前事实。<\/li><li><b>最近一次推进的状态：<\/b>新增决定、完成内容、待确认项和下一步。交接或重开会话时优先补这一层。<\/li><\/ul><p>信息越多不一定越有用。大量重复聊天会掩盖关键决定；只给最终文件又可能缺少选择理由。可维护一份短的工作摘要，把详细材料作为可追溯来源。<\/p><h3>处理冲突：哪份材料说了算？<\/h3><p>例如方案写周五、会议记录写周六，不应只凭文件更新时间选一个。先看谁有权确认、记录是否明确通过、是否针对同一事项；仍无法判断就列为待确认。确认后写清生效值与被替代的旧值，再检查相关成果。<\/p><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可以这样说 · 教学示例<\/span><button class=\"copy\" data-copy=\"contextcheck\">复制<\/button><\/div><pre id=\"contextcheck\">请先根据当前材料整理工作摘要：已确认事实、已有决定及理由、相互冲突的信息、待确认项、下一步。重要信息附来源和日期。遇到两个版本不一致，先指出冲突，不要自行把较新的草稿当作正式结论。<\/pre><\/div><p class=\"smalltext\">以上是使用与核验方法，不代表所有上下文都会自动同步，或系统会永久完整记住每一句对话。<\/p><div class=\"notearea\"><label class=\"field\" for=\"note2\">用自己的话记下一条要点<\/label><textarea id=\"note2\" data-note=\"note2\" placeholder=\"只记录学习要点，不填写真实敏感信息\"><\/textarea><div class=\"savehint\">仅本机保存，可导出，不会自动提交。<\/div><\/div>"}, {"short": "开始一件工作", "title": "先把工作交清楚，<br>再开始执行。", "desc": "找到正确工作，提供必要材料，确认读取和交付标准。", "time": "10分钟", "body": "<h2>开始前先判断：旧事接续，还是新事启动？<\/h2><p>同一件活动补材料、改方案，优先回到原工作。目标和对象已经不同，再建立新工作。标题写成可辨认的业务事项，比“帮我做一下”更好找。<\/p><ol><li style=\"margin:16px 0\"><b>写清目标。<\/b>交付什么、给谁用、何时需要、怎样算合格。<\/li><li style=\"margin:16px 0\"><b>添加必要材料。<\/b>上传文件、图片，或提供飞书资料链接；把已确认材料与待讨论草稿区分开。<\/li><li style=\"margin:16px 0\"><b>先确认读取。<\/b>请龙喵说明读到了什么、缺了什么；不能把“已收到链接”当作正文已读取。<\/li><li style=\"margin:16px 0\"><b>说明执行范围。<\/b>本次只是草稿，还是也要更新正式记录；涉及发送通知时说清对象和内容。<\/li><li style=\"margin:16px 0\"><b>从第一份阶段结果开始检查。<\/b>发现方向偏了及时纠正，别等所有内容完成才返工。<\/li><\/ol><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可以这样说 · 教学示例<\/span><button class=\"copy\" data-copy=\"start\">复制<\/button><\/div><pre id=\"start\">请根据我提供的活动方案和会议纪要，整理一份内部筹备清单。\n先确认两份材料是否读取成功，再列出事项、负责人、截止时间、交付物和待确认问题。\n只用材料里已确认的信息，没有说清的标待确认。请附关键结论的来源，交付可编辑表格，供我审核；本次先不发通知。<\/pre><\/div><h2>自己的Agent很懂自己，换到龙喵接不上怎么办？<\/h2><p>把已有背景整理成可共享的工作资料：目标、关键决定、材料链接、当前成果、未解决问题。可让原来的桌面端Agent整理到飞书文档，再把有权读取的链接交给龙喵。缺什么逐步补齐。<\/p><div class=\"notice\">11月16日周会强调上下文迁移与逐步补齐。迁移工作需要的内容即可，个人私密记忆不应整包搬入团队。<\/div><h2>材料读不到时怎么处理？<\/h2><p>先核对链接和工作身份。缺权限就通过可用入口向所有者申请并反馈状态；获批后重新读取。无申请入口时，明确请谁授予什么权限，或在允许范围内提供必要文件。不要用“所有人可见”绕过权限。<\/p><p class=\"smalltext\">具体上传位置和文件大小限制未在当前平台界面核验，本课不写固定按钮路径和限额。<\/p><h2>任务交得清楚，具体清楚到什么程度？<\/h2><div class=\"table-wrap\" role=\"region\" aria-label=\"知识对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>交办要素<\/th><th>含糊的说法<\/th><th>足够开始的说法<\/th><\/tr><\/thead><tbody><tr><td>目标与用途<\/td><td>做个活动方案<\/td><td>给内部讨论使用，先帮助确定活动形式<\/td><\/tr><tr><td>交付形态<\/td><td>整理一下资料<\/td><td>一份可编辑筹备表，列事项、负责人、日期和凭据<\/td><\/tr><tr><td>事实边界<\/td><td>参考以前的安排<\/td><td>以前的结构可参考，本次日期只认已确认纪要<\/td><\/tr><tr><td>质量标准<\/td><td>做得专业一点<\/td><td>数字有来源、待确认项单列、同一信息前后一致<\/td><\/tr><tr><td>动作范围<\/td><td>帮我处理掉<\/td><td>先生成内部稿；本轮不发通知、不修改正式报名表<\/td><\/tr><\/tbody><\/table><\/div><p>无需每次写长提示词。已有工作中，龙喵能读取到的背景可直接引用；真正要补的是本次变化和验收要求。指令长度取决于缺口大小，不取决于任务听起来是否复杂。<\/p><h2>材料接入后，先验“读到了什么”<\/h2><p>提供飞书链接后，可请龙喵列出材料标题、覆盖范围与缺失项。文件中的图片、附件、关联表格可能没有随正文一起读到，尤其要确认完成任务所需的关键部分。材料很多时，先给目录与最关键文件，再按需要补充。<\/p><div class=\"table-wrap\" role=\"region\" aria-label=\"知识对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>输入情况<\/th><th>合理处理<\/th><\/tr><\/thead><tbody><tr><td>本地文件<\/td><td>上传或放到当前工作可访问的位置；仅报电脑文件名不足以读取<\/td><\/tr><tr><td>飞书文档或妙记<\/td><td>确认正确链接、访问身份和正文读取结果；只有摘要时不要冒称核对了全文<\/td><\/tr><tr><td>扫描件或截图<\/td><td>确认识别出的数字、表头和单位，关键模糊处回看原图<\/td><\/tr><tr><td>多版本材料<\/td><td>指明哪些已采用、哪些供参考；记录替代关系<\/td><\/tr><tr><td>存在权限缺口<\/td><td>申请相应读取权限并跟进；获批后重新验证正文<\/td><\/tr><\/tbody><\/table><\/div><h2>已有私人Agent的背景，只在需要时迁入一次<\/h2><p>若过去的项目一直在其他环境完成，可整理一份交接摘要，把相关材料、决定和现状带到龙喵。迁移完成后，后续变化继续在当前工作维护。这是接续历史工作的办法，不要求以后每次任务都先经过另一个工具。<\/p><div class=\"notice\"><b>最小阶段检查：<\/b>资料多或方向不明确时，先检查“读到的事实＋拟交付结构”。确认后再展开制作，可以较早发现理解偏差；目标清楚的简单任务可直接完成，不必增加多余关口。<\/div><div class=\"notearea\"><label class=\"field\" for=\"note3\">用自己的话记下一条要点<\/label><textarea id=\"note3\" data-note=\"note3\" placeholder=\"只记录学习要点，不填写真实敏感信息\"><\/textarea><div class=\"savehint\">仅本机保存，可导出，不会自动提交。<\/div><\/div>"}, {"short": "推进与协作", "title": "在原现场推进，<br>让下一位接得上。", "desc": "掌握反馈、主子会话、分支、并行和交接的基本用途。", "time": "11分钟", "body": "<h2>反馈要让下一步能执行<\/h2><p>“再好一点”很难判断改到哪里。直接指出事实、范围与标准：<\/p><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可以这样说 · 教学示例<\/span><button class=\"copy\" data-copy=\"feedback\">复制<\/button><\/div><pre id=\"feedback\">活动日期仍待确认，请去掉已确定日期的表述。已核实的负责人保持不变。先列出需要修改的段落，再更新这一版方案。<\/pre><\/div><h2>什么时候用哪种会话？<\/h2><div class=\"table-wrap\" role=\"region\" aria-label=\"知识对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>情形<\/th><th>建议方式<\/th><th>要回到哪里<\/th><\/tr><\/thead><tbody><tr><td>对现有方案补充或修改<\/td><td>原会话继续<\/td><td>同一工作中的当前版本<\/td><\/tr><tr><td>同一事项中的独立子任务<\/td><td>子会话处理物料、预算等<\/td><td>主线汇总关键结论与成果<\/td><\/tr><tr><td>想比较两条不同方向<\/td><td>在适合的节点开分支探索<\/td><td>选定后记录采用方向及理由<\/td><\/tr><tr><td>几件互不依赖的工作<\/td><td>分别开工作／会话并行<\/td><td>各自工作维护状态<\/td><\/tr><\/tbody><\/table><\/div><p>分支如何继承内容、子会话能够看到哪些材料，以当前界面为准。不要默认每个会话会自动同步全部新决定。<\/p><div class=\"notice\">并行的前提是依赖清楚。日期尚未确定时，可以先设计物料结构；正式发布内容要等日期确认。<\/div><h2>交接时，把工作现场一起交出去<\/h2><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可以这样说 · 教学示例<\/span><button class=\"copy\" data-copy=\"handover\">复制<\/button><\/div><pre id=\"handover\">请整理这件工作的交接摘要：目标、现状、关键材料、已确认决定和理由、采用版本、未解决的问题、下一步。每个重要结论附来源链接。已完成和待处理分开写，缺失信息标待确认。请保存在这件工作中，先不替我通知其他同事。<\/pre><\/div><button class=\"btn secondary small\" data-download=\"handover\">下载交接提示<\/button><p>邀请协作或移交时，核对参与者能访问对应材料，明确谁负责下一步。查看过会话、收到消息与接手负责是不同状态。<\/p><h2>找工作与排查问题<\/h2><p>用筛选查当前状态、置顶高频工作、到归档中找旧成果。出现报错时保留会话链接、操作步骤、错误提示和期望结果，让协助者回到现场。不要只传一句“坏了”。<\/p><p class=\"smalltext\">11月16日彬哥分享多会话推进与现场协助；11月2日交接包、SOP等方法主要由AJ分享。这里按方法整理，未将全部发言归为彬哥。<\/p><h2>并行是否有效，取决于依赖而非会话数量<\/h2><p>可先把工作分成“能独立做”和“要等前提确定”两类。活动日期未确认时，预算结构、版式草稿可以推进；正式通知和含日期海报还不能定稿。多开会话可以缩短独立任务的等待，但也会增加口径同步和汇总成本。<\/p><div class=\"table-wrap\" role=\"region\" aria-label=\"知识对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>组织方式<\/th><th>适合处理<\/th><th>主要风险<\/th><th>需要留下的内容<\/th><\/tr><\/thead><tbody><tr><td>原会话继续<\/td><td>同一成果的逐轮修改<\/td><td>长对话中最新要求被淹没<\/td><td>本次改动、保留项、采用版本<\/td><\/tr><tr><td>子会话<\/td><td>目标一致、可分开的制作任务<\/td><td>局部做好却与整体冲突<\/td><td>共同约束、输入、输出和汇总位置<\/td><\/tr><tr><td>分支探索<\/td><td>同一问题的不同方案<\/td><td>备选稿被误当已决定<\/td><td>备选标签、比较标准与选择理由<\/td><\/tr><tr><td>独立工作<\/td><td>目标、对象或完成条件不同<\/td><td>状态和责任混在一起<\/td><td>各自目标、负责人和来源关联<\/td><\/tr><\/tbody><\/table><\/div><h2>分出去之前，给清“输入—输出—汇总”<\/h2><p>例如物料会话的输入是已确认的活动信息，输出是可编辑海报和预览图，汇总位置是活动工作中的成果记录。负责人、预算上限和未确认信息应保持一致。子任务做完后，还要把结果交回主线核验，不能把“各自完成”当成整体完成。<\/p><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可以这样说 · 教学示例<\/span><button class=\"copy\" data-copy=\"sync\">复制<\/button><\/div><pre id=\"sync\">活动地点已确认改为三层共创区，人数上限不变。请先找出受影响的方案、物料和通知草稿，列清需要更新的位置；按这个已确认决定修改，并保留其他已核实内容。完成后给我一份修改清单和对应文件，先不发布。<\/pre><\/div><h2>反馈分三种，推进方式也不同<\/h2><ul><li><b>事实纠错：<\/b>给正确依据，并要求检查受影响的其他文件。例如日期错误可能同时影响海报、日程和通知。<\/li><li><b>质量改进：<\/b>说明对象与标准。例如面向首次来访者，要补清入口和到场方式。<\/li><li><b>方向改变：<\/b>明确旧目标哪些作废、新目标是什么。先重新检查依赖，再继续制作。<\/li><\/ul><h2>卡住时，把问题缩小到能处理的范围<\/h2><p>没权限，就找资源所有者和对应身份；材料冲突，就列出冲突并定位有权判断的人；工具报错，就保留错误与执行现场。对发送、写入等有实际影响的动作，结果不明时先查原记录和回执，避免一句“再试一次”造成重复执行。<\/p><div class=\"notice\">交接要确认两件事：对方能打开必要材料，以及对方明确承担哪一步。会话分享出去，只证明提供了入口，不自动改变责任归属。<\/div><div class=\"notearea\"><label class=\"field\" for=\"note4\">用自己的话记下一条要点<\/label><textarea id=\"note4\" data-note=\"note4\" placeholder=\"只记录学习要点，不填写真实敏感信息\"><\/textarea><div class=\"savehint\">仅本机保存，可导出，不会自动提交。<\/div><\/div>"}, {"short": "验收与采用", "title": "成果打开检查，<br>再留下采用版本。", "desc": "区分已接收、已完成、已采用，让交付有可核验的结果。", "time": "10分钟", "body": "<h2>“完成了”只是检查的起点<\/h2><div class=\"table-wrap\" role=\"region\" aria-label=\"知识对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>状态<\/th><th>意味着什么<\/th><th>还要看什么<\/th><\/tr><\/thead><tbody><tr><td>已接收<\/td><td>请求被接纳<\/td><td>是否真正执行、是否有结果<\/td><\/tr><tr><td>执行完成<\/td><td>本次任务给出结果<\/td><td>内容、文件、来源是否合格<\/td><\/tr><tr><td>人工采用<\/td><td>有权人选择正式使用的版本<\/td><td>确认人、理由、关联记录<\/td><\/tr><tr><td>业务完成<\/td><td>达成这件事的完成条件<\/td><td>真实业务凭据和遗留事项<\/td><\/tr><\/tbody><\/table><\/div><p>例如海报已生成，不代表日期核验通过；海报已采用，也不代表活动已经举办。工具执行完成与整件业务结束要分开判断。<\/p><h2>用五分钟打开成果<\/h2><ol><li style=\"margin:16px 0\"><b>能否使用：<\/b>文件能打开、链接能访问，需要编辑时确实可编辑。<\/li><li style=\"margin:16px 0\"><b>内容是否有据：<\/b>核对人名、数字、日期、关键结论；疑问回到来源。<\/li><li style=\"margin:16px 0\"><b>是否达标：<\/b>检查目标、受众、篇幅和格式，缺项明确列出。<\/li><li style=\"margin:16px 0\"><b>采用哪版：<\/b>确定后记录正式采用的版本、确认人和理由，草稿保留但不要混称终版。<\/li><li style=\"margin:16px 0\"><b>工作是否闭合：<\/b>同步完成或取消状态；没做完的写清下一步，不用完成标记掩盖遗留问题。<\/li><\/ol><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可以这样说 · 教学示例<\/span><button class=\"copy\" data-copy=\"accept\">复制<\/button><\/div><pre id=\"accept\">成果验收卡\n1. 文件或链接能打开、能按需要编辑。\n2. 人名、数字、日期及关键结论有来源。\n3. 达到本次交付标准，待确认项清楚。\n4. 采用的版本明确，确认人和理由可追溯。\n5. 工作状态、材料、下一步同步更新。\n6. 生成、发送、对方确认、业务完成分别核对。<\/pre><\/div><button class=\"btn secondary small\" data-download=\"accept\">下载成果验收卡<\/button><details><summary>发现一处错误，怎样改得更稳？<\/summary><p>指明错误、正确依据、修改范围与保留项。修改后复查受影响内容，例如改活动日期时，一并查方案、海报和通知，避免只改一处。<\/p><\/details><div class=\"notice\">人掌握目标、节奏和质量标准。采用判断与修改理由留下来，才能供下一次工作参考。<\/div><h2>验收不能只看最后一段回复<\/h2><div class=\"table-wrap\" role=\"region\" aria-label=\"知识对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>验收层次<\/th><th>要回答的问题<\/th><th>可以接受的凭据<\/th><\/tr><\/thead><tbody><tr><td>内容<\/td><td>有没有达到目标，关键事实是否正确？<\/td><td>可核对的来源、计算过程、缺口说明<\/td><\/tr><tr><td>文件<\/td><td>结果是否可打开、可编辑、可继续使用？<\/td><td>实际文件、链接权限和格式检查<\/td><\/tr><tr><td>动作<\/td><td>要求的发送、更新等动作是否发生？<\/td><td>发送回执、目标记录回读、更新时间<\/td><\/tr><tr><td>业务<\/td><td>这件事的完成条件是否真正满足？<\/td><td>对应业务记录、验收结论和未完事项<\/td><\/tr><\/tbody><\/table><\/div><p>“文档生成成功”可能只满足文件这一层；“通知送达”能够证明发送结果，但不能证明收件人已读或已经照办。判断必须与本次要求对齐：如果任务只是发送通知，送达凭据即可结束；如果任务要求落实人员到场，还需要另查业务结果。<\/p><h2>用事实底表统一数字和口径<\/h2><p>当一个任务产出多份材料时，可先整理一张事实底表，记录字段、当前值、来源、核验时间和确认状态。表中的“报名人数”“确认到场人数”“实际到场人数”必须分列，不能为了让叙述顺畅而混用。<\/p><div class=\"table-wrap\" role=\"region\" aria-label=\"知识对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>示例字段（教学模拟）<\/th><th>当前值与状态<\/th><th>验收重点<\/th><\/tr><\/thead><tbody><tr><td>活动日期<\/td><td>待确认<\/td><td>所有对外稿均不写成已确定<\/td><\/tr><tr><td>报名团队数<\/td><td>按有效报名记录去重后计算<\/td><td>去重单位是团队，不能直接数表格行数<\/td><\/tr><tr><td>采用海报<\/td><td>指向已确认的具体文件或版本<\/td><td>链接目标与实际预览图必须一致<\/td><\/tr><\/tbody><\/table><\/div><h2>什么叫“采用了这一版”？<\/h2><p>采用记录至少回答：哪个成果、哪一版、谁确认、何时确认、为什么采用、还剩什么限制。被替换的旧稿可以保留追溯，但要明确它不再是当前正式版本。采用理由应说明真正影响选择的事实或取舍，单写“不错”帮助有限。<\/p><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可以这样说 · 教学示例<\/span><button class=\"copy\" data-copy=\"adopt\">复制<\/button><\/div><pre id=\"adopt\">我确认采用这份方案的第二版：它已纠正活动地点，并保留了预算上限。请记录本次采用版本和理由，旧版保留为历史参考。嘉宾名单仍待确认，相关物料先不发布；把这项列入下一步，不把整件工作标为结束。<\/pre><\/div><h2>验收失败时怎样返修？<\/h2><p>把问题定位到具体文件、段落或字段，给出正确依据和修改范围。修订后重点复查受影响部分与跨文件一致性；无需每次推倒全部重做。若原始材料本身缺失，先补事实，不能靠反复润色消除不确定性。<\/p><div class=\"notearea\"><label class=\"field\" for=\"note5\">用自己的话记下一条要点<\/label><textarea id=\"note5\" data-note=\"note5\" placeholder=\"只记录学习要点，不填写真实敏感信息\"><\/textarea><div class=\"savehint\">仅本机保存，可导出，不会自动提交。<\/div><\/div>"}, {"short": "复用与自动化", "title": "这次的判断，<br>成为下次的起点。", "desc": "分清资料、知识与Skill，知道哪些工作适合定时执行。", "time": "12分钟", "body": "<h2>留下文件之后，还能再做一步<\/h2><div class=\"table-wrap\" role=\"region\" aria-label=\"知识对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>积累方式<\/th><th>放什么<\/th><th>下次怎么用<\/th><\/tr><\/thead><tbody><tr><td>资料库<\/td><td>原材料、交付物、版本和链接<\/td><td>找到并回看原始信息<\/td><\/tr><tr><td>组织知识<\/td><td>经过整理的事实、经验与适用条件<\/td><td>检索相关结论，再核对当前情况<\/td><\/tr><tr><td>Skill<\/td><td>重复任务的方法、输入输出与注意点<\/td><td>按任务调用，并根据反馈改进<\/td><\/tr><\/tbody><\/table><\/div><p>文章里的案例：一次内容发布后被限流，团队复核认为照片背景中的引导语、网址或二维码可能相关。经验被整理后，其他工作据此增加图片背景检查。<b>这是一条待结合场景使用的经验，不能推成“二维码必然导致限流”。<\/b><\/p><h2>什么值得沉淀为方法？<\/h2><p>任务反复出现、步骤逐渐稳定、有明确输入与验收标准时，可以整理为SOP或Skill。例如PPT制作，既留下模板，也留下受众、叙事、核验和交付规则。优先复用已有合适方法，避免每个任务新造一套。<\/p><div class=\"prompt\"><div class=\"prompthead\"><span class=\"label\">可以这样说 · 教学示例<\/span><button class=\"copy\" data-copy=\"skill\">复制<\/button><\/div><pre id=\"skill\">请把这次采用的做法整理为可复用方法，保留适用条件、必要输入、关键步骤、检查标准和失败情形。区分本次特例与通用步骤，先给我审阅，不自动替换现有Skill。<\/pre><\/div><h2>定时任务和仪表盘分别解决什么？<\/h2><p><b>定时任务<\/b>按指定节奏触发工作，例如汇总本周已核验业务记录。<b>仪表盘<\/b>展示结果与状态；页面好看或能打开，不代表数据仍是最新的，应查看来源和更新时间。<\/p><ol><li style=\"margin:16px 0\"><b>先手动跑通。<\/b>确认来源可读、逻辑正确、交付有用。<\/li><li style=\"margin:16px 0\"><b>写清运行条件。<\/b>时区、频率、数据范围、交付位置、成功标准；需要通知时明确收件人。<\/li><li style=\"margin:16px 0\"><b>核对定时环境。<\/b>能否访问材料和工具，权限是否仍有效。首次实际运行后查结果。<\/li><li style=\"margin:16px 0\"><b>减少空转。<\/b>按变化频率安排执行，简单任务使用合适成本的模型；停止无用任务。<\/li><\/ol><details><summary>知识整理一定是每天凌晨三点吗？<\/summary><p>公众号记录了模数当时的安排。具体时刻、人数与知识条数都是历史实践数据，不能视为所有账号的默认功能或当前状态。你的自动化安排应以任务需要和实际配置为准。<\/p><\/details><h2>从一次成果到团队经验，中间还有几步<\/h2><div class=\"flow\"><div><b>留下证据<\/b>成果与反馈<\/div><div><b>解释原因<\/b>有效条件<\/div><div><b>形成方法<\/b>步骤与检查<\/div><div><b>再次应用<\/b>复核与更新<\/div><\/div><p>文件存入资料库，解决“找得到”；提炼为知识，解决“理解为什么”；整理为Skill，帮助“按合适的方法做”。整理完成后还需在真实任务中再次检验，不能因为写成了规范就视为永远正确。<\/p><div class=\"table-wrap\" role=\"region\" aria-label=\"知识对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>需要保存的内容<\/th><th>为什么重要<\/th><\/tr><\/thead><tbody><tr><td>输入与适用场景<\/td><td>避免把活动宣传的方法直接套到政策说明<\/td><\/tr><tr><td>采用理由与人工修改<\/td><td>让下一次知道质量标准在哪里<\/td><\/tr><tr><td>失败情形与例外<\/td><td>知道哪些条件下应停下来换方法<\/td><\/tr><tr><td>来源和核验日期<\/td><td>政策、名单、产品能力等动态事实需要回源<\/td><\/tr><tr><td>再次使用的效果<\/td><td>根据真实反馈决定保留、修改或停用<\/td><\/tr><\/tbody><\/table><\/div><h2>什么时候调用Skill，什么时候继续打磨？<\/h2><p>有现成且适用的方法时，可明确请龙喵先查找并使用，再根据本次目标调整。连续做几次都要纠正同一个问题，才值得把稳定规则补回方法。一个客户的一次临时偏好，应保留在该工作中，避免变成所有任务都遵守的规则。<\/p><h2>自动化的是稳定流程，判断仍要有依据<\/h2><p>以周报为例：取数、去重、计算等确定性步骤可用脚本辅助；异常解释、重点选择与下一步建议需要结合当期上下文判断。先把两类工作分清，有助于降低成本并提高可检查性。定时运行还必须具备实际读取来源的权限和工具环境。<\/p><div class=\"table-wrap\" role=\"region\" aria-label=\"知识对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>定时任务必须说清<\/th><th>周报中的具体问题<\/th><\/tr><\/thead><tbody><tr><td>来源与周期<\/td><td>读哪些业务记录，统计哪一周，用哪个时区？<\/td><\/tr><tr><td>数据口径<\/td><td>按企业、人数还是事件统计，如何去重？<\/td><\/tr><tr><td>交付与完成凭据<\/td><td>保存到哪里，如何确认生成成功？<\/td><\/tr><tr><td>缺数与异常<\/td><td>无新数据和读取失败如何区分，哪些项标待核？<\/td><\/tr><tr><td>通知范围<\/td><td>是否需要发送，发送给谁，何时发送？<\/td><\/tr><tr><td>暂停与维护<\/td><td>业务停止或来源变化时，谁更新或停用任务？<\/td><\/tr><\/tbody><\/table><\/div><h2>怎样看自动化有没有真的省事？<\/h2><p>观察取数是否可靠、结果是否被采用、人工返工是否减少、一次经验能否在下一次复用。不要只看运行次数或知识条数。仪表盘需要标明数据来源和更新时间；任务显示运行成功，也要打开实际成果验证内容。<\/p><div class=\"notice\"><b>本课的最终判断：<\/b>用龙喵把一件事做完，再把背景、决定和可用方法留下来。先建立可靠的工作方式，随后才扩大并行和自动化；无需为了流程完整额外引入豆包工作或WorkBuddy。<\/div><h2>本课收尾：试着回答四个问题<\/h2><ul><li>工作、会话、成果各是什么？<\/li><li>换人接手时，哪些背景必须留下？<\/li><li>何时可以标记采用，何时才能说业务完成？<\/li><li>哪些重复工作已具备自动化条件？<\/li><\/ul><div class=\"notice\"><b>第五课再完整做一遍。<\/b>本课到原理与功能判断为止；下一课用真实办公案例练习材料准备、协作修改、核验、采用和归档。完成本课自测不代表已通过平台实操验收。<\/div><div class=\"notearea\"><label class=\"field\" for=\"note6\">用自己的话记下一条要点<\/label><textarea id=\"note6\" data-note=\"note6\" placeholder=\"只记录学习要点，不填写真实敏感信息\"><\/textarea><div class=\"savehint\">仅本机保存，可导出，不会自动提交。<\/div><\/div>"}], "quiz": [{"q": "豆包工作、WorkBuddy和龙喵怎样比较更准确？", "opts": ["前两者完全不支持团队协作", "能力有重叠，对比帮助理解龙喵定位，不等于要搭配使用", "龙喵一定在所有任务上更快"], "a": 1, "why": "本课比较定位和工作方式，没有同题性能实测。", "lesson": 1, "dim": "工具选择"}, {"q": "模数日常做活动方案和PPT，通常怎样开展？", "opts": ["先用豆包工作，再用WorkBuddy，最后交龙喵归档", "龙喵只能管理进度，不能制作成果", "直接在龙喵中完成读取、制作、核验与归档；确有缺口再评估补充方案"], "a": 2, "why": "其他产品只用于对比理解，日常通常无需切换。龙喵同时参与执行和团队协作。", "lesson": 1, "dim": "工作方式"}, {"q": "同一场活动需要方案与物料两路推进，怎样组织？", "opts": ["同一Work下按需开会话，并汇总关键结论", "每次补充都新建一个毫无关联的工作", "所有不同活动永远共用一个会话"], "a": 0, "why": "一件事可以有多个会话，但关键结果要关联回这件工作。", "lesson": 2, "dim": "工作上下文"}, {"q": "龙喵回复收到飞书链接，下一步先确认什么？", "opts": ["已经读到所有企业文档", "是否读到正文，是否存在权限或缺失问题", "已经替你对外发送"], "a": 1, "why": "收到链接与读取成功不同；缺权限要申请并在获批后重新读取。", "lesson": 3, "dim": "工作上下文"}, {"q": "把私人Agent的背景迁到组织中，应怎样做？", "opts": ["整包搬入所有私人记忆", "只给一个文件名即可", "整理当前工作需要的目标、材料、决定、版本和待办"], "a": 2, "why": "按工作需要与授权迁移，保留有用背景和边界。", "lesson": 3, "dim": "工作上下文"}, {"q": "活动日期没确定，物料任务如何并行？", "opts": ["先做结构，正式发布等日期确认", "把猜测日期写成已确认", "停止所有不依赖日期的工作"], "a": 0, "why": "识别依赖，可独立部分先推进，不能把未确认条件当事实。", "lesson": 4, "dim": "协作推进"}, {"q": "交接只写“已经做了一半”够吗？", "opts": ["够，接手人会猜", "还要留下材料、决定、版本、问题与下一步", "只发全部聊天截图，不作整理"], "a": 1, "why": "交接需要可继续执行的上下文，并明确下一步负责人。", "lesson": 4, "dim": "协作推进"}, {"q": "海报已生成且被采用，能否标记整场活动已经举办？", "opts": ["可以，Agent执行完成即可", "可以，采用就等于所有业务结束", "不能，业务完成要看活动本身的完成凭据"], "a": 2, "why": "生成、采用和业务完成是不同状态。", "lesson": 5, "dim": "验收采用"}, {"q": "一份可重复使用的方法应包含什么？", "opts": ["输入、步骤、适用条件和验收标准", "只存最终文件", "写成任何任务都必须照搬的规则"], "a": 0, "why": "Skill承载可复用方法，也要保留边界和失败情形。", "lesson": 6, "dim": "经验复用"}, {"q": "想让周报自动生成，合理的起点是什么？", "opts": ["先设最高频率一直运行", "先手动跑通，再确认来源、权限、节奏和交付标准", "有仪表盘就代表数据自动更新"], "a": 1, "why": "先确认可运行且结果有用，再核对定时环境和实际运行结果。", "lesson": 6, "dim": "经验复用"}], "home": "<div class=\"crumb\">模数学习室 / 第四课 · 原编号03<\/div><section class=\"hero\"><div><div class=\"eyebrow\">Context makes teamwork possible<\/div><h1>让工作接得住，<br>让经验留得下。<\/h1><p class=\"lead\">认识龙喵：原理与基本功能。<br>在同一个会话里看见彼此的讨论，<br>一起修改、验收与交接。<\/p><div class=\"meta\"><span>全员必修<\/span><span>学习约55–70分钟<\/span><\/div><div class=\"row\"><a class=\"btn\" id=\"start\" href=\"#lesson1\">开始学习 →<\/a><a class=\"btn secondary\" href=\"#framework\">查看本课大纲<\/a><\/div><\/div><svg class=\"hero-art\" viewBox=\"0 0 400 390\" role=\"img\" aria-label=\"一件工作连接多个会话，汇聚成果与经验\"><g fill=\"#fffdf8\" stroke=\"#77746a\" stroke-width=\"1.7\"><rect x=\"30\" y=\"54\" width=\"104\" height=\"68\" rx=\"8\"/><rect x=\"148\" y=\"32\" width=\"104\" height=\"68\" rx=\"8\"/><rect x=\"266\" y=\"54\" width=\"104\" height=\"68\" rx=\"8\"/><path d=\"M82 122v40h118m118-40v40H200m0-62v92\" fill=\"none\"/><rect x=\"92\" y=\"192\" width=\"216\" height=\"84\" rx=\"12\"/><path d=\"M200 276v42M90 318h220\"/><circle cx=\"90\" cy=\"318\" r=\"6\"/><circle cx=\"310\" cy=\"318\" r=\"6\"/><\/g><g fill=\"#555249\" text-anchor=\"middle\" font-size=\"16\"><text x=\"82\" y=\"96\">方案会话<\/text><text x=\"200\" y=\"74\">主会话<\/text><text x=\"318\" y=\"96\">物料会话<\/text><text x=\"200\" y=\"228\" fill=\"#aa4c32\" font-size=\"23\">一件工作 Work<\/text><text x=\"200\" y=\"254\" font-size=\"13\">目标 · 决定 · 采用版本 · 下一步<\/text><text x=\"90\" y=\"351\">可用成果<\/text><text x=\"310\" y=\"351\">可复用经验<\/text><\/g><\/svg><\/section><section class=\"band\"><div><span class=\"eyebrow\">这一课的主线<\/span><p class=\"caption\">第四课 / Course 03<\/p><\/div><div><blockquote>会话可以有多个，<br>关键背景留在这件事上。<\/blockquote><p>知道何时用什么功能，知道什么结果值得信任。完整办公案例留到第五课。<\/p><\/div><\/section><div class=\"cards\"><a class=\"card\" href=\"#lesson1\"><span class=\"eyebrow\">01<\/span><h3>龙喵与团队工作 →<\/h3><p>理解龙喵怎样完成任务并承接团队上下文；产品对比仅帮助理解定位。<\/p><\/a><a class=\"card\" href=\"#lesson2\"><span class=\"eyebrow\">02<\/span><h3>原理与上下文 →<\/h3><p>分清模型、工具、Skill，以及工作、会话和成果。<\/p><\/a><a class=\"card\" href=\"#lesson3\"><span class=\"eyebrow\">03<\/span><h3>开始一件工作 →<\/h3><p>找到正确工作，提供必要材料，确认读取和交付标准。<\/p><\/a><a class=\"card\" href=\"#lesson4\"><span class=\"eyebrow\">04<\/span><h3>推进与协作 →<\/h3><p>掌握反馈、主子会话、分支、并行和交接的基本用途。<\/p><\/a><a class=\"card\" href=\"#lesson5\"><span class=\"eyebrow\">05<\/span><h3>验收与采用 →<\/h3><p>区分已接收、已完成、已采用，让交付有可核验的结果。<\/p><\/a><a class=\"card\" href=\"#lesson6\"><span class=\"eyebrow\">06<\/span><h3>复用与自动化 →<\/h3><p>分清资料、知识与Skill，知道哪些工作适合定时执行。<\/p><\/a><\/div><div class=\"notice\">6个深入单元，覆盖上下文、任务拆分、协作、验收和复用；附可下载检查卡与10题情境自测。产品对比仅作定位说明，日常工作围绕龙喵完成。页面不调用AI、不上传笔记，也不会自动创建真实任务。<\/div>", "framework": "<article class=\"lesson\"><div class=\"eyebrow\">Course 03 / 第四课<\/div><h1>让工作接得住，<br>让经验留得下。<\/h1><p class=\"intro\">认识龙喵，理解从一件工作到团队经验的完整关系。深入阅读约55–70分钟，自测约8分钟，实际用时因人而异。<\/p><div class=\"table-wrap\" role=\"region\" aria-label=\"知识对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>单元<\/th><th>学会什么<\/th><\/tr><\/thead><tbody><tr><td><a href=\"#lesson1\">01 · 龙喵与团队工作<\/a><\/td><td>理解龙喵怎样完成任务并承接团队上下文；产品对比仅帮助理解定位。<\/td><\/tr><tr><td><a href=\"#lesson2\">02 · 原理与上下文<\/a><\/td><td>分清模型、工具、Skill，以及工作、会话和成果。<\/td><\/tr><tr><td><a href=\"#lesson3\">03 · 开始一件工作<\/a><\/td><td>找到正确工作，提供必要材料，确认读取和交付标准。<\/td><\/tr><tr><td><a href=\"#lesson4\">04 · 推进与协作<\/a><\/td><td>掌握反馈、主子会话、分支、并行和交接的基本用途。<\/td><\/tr><tr><td><a href=\"#lesson5\">05 · 验收与采用<\/a><\/td><td>区分已接收、已完成、已采用，让交付有可核验的结果。<\/td><\/tr><tr><td><a href=\"#lesson6\">06 · 复用与自动化<\/a><\/td><td>分清资料、知识与Skill，知道哪些工作适合定时执行。<\/td><\/tr><\/tbody><\/table><\/div><h2>学完的判断标准<\/h2><p>能解释龙喵的执行与协作机制；知道给什么上下文、何时分会话、如何交接；能区分执行完成、人工采用与业务完成；能判断重复工作是否适合自动化。<\/p><p>本课不要求完成真实办公项目，完整案例实操留给第五课。<\/p><button class=\"btn secondary\" data-download=\"framework\">下载大纲<\/button><\/article>", "sources": "<article class=\"lesson\"><div class=\"eyebrow\">Sources & scope<\/div><h1>参考与说明<\/h1><p class=\"intro\">用文章理解组织协作，用周会理解实际方法。历史实践与当前产品能力分开看。<\/p><h2>文章与产品参考<\/h2><ul><li><a href=\"https://mp.weixin.qq.com/s/_Oqap3arVuMzjHmFd6MRrQ\" target=\"_blank\" rel=\"noopener noreferrer\">人人都有Agent之后：我们在自己的AI社区里做Team Agent<\/a>：2026-11-11发布，正文由庄庄提供；课程图为教学关系示意，非平台截图。<\/li><li><a href=\"https://www.feishu.cn/content/article/7677519271848610746\" target=\"_blank\" rel=\"noopener noreferrer\">豆包工作官方介绍<\/a><\/li><li><a href=\"https://cloud.tencent.cn/document/product/1831/138797\" target=\"_blank\" rel=\"noopener noreferrer\">WorkBuddy企业版项目说明<\/a><\/li><\/ul><h2>周会转写定位<\/h2><div class=\"table-wrap\" role=\"region\" aria-label=\"知识对照表\" tabindex=\"0\"><table class=\"table\"><thead><tr><th>来源与发言归属<\/th><th>转写定位<\/th><th>课程用途<\/th><\/tr><\/thead><tbody><tr><td>10月12日 · 彬子<\/td><td>35:51–43:19；53:26–56:18<\/td><td>协作现场、上下文、接手与知识沉淀<\/td><\/tr><tr><td>10月26日 · 彬子<\/td><td>17:47；33:09；34:25–37:13；47:30–55:48<\/td><td>材料、主子会话、状态、采用、Skill与自动化<\/td><\/tr><tr><td>11月2日 · AJ<\/td><td>01:33–01:39（小时:分钟）<\/td><td>会议归档、交接包、SOP与方法复用<\/td><\/tr><tr><td>11月2日 · Speaker 1<\/td><td>01:09–01:10（小时:分钟）<\/td><td>模型与空转成本，未确认实名<\/td><\/tr><tr><td>11月9日 · Speaker 1<\/td><td>36:49–41:28；46:44–48:47<\/td><td>数据采集、分析方法与事实核验，未确认实名<\/td><\/tr><tr><td>11月16日 · 彬子<\/td><td>32:33；42:21；52:13–54:05；58:31；01:00:07；01:07:45–01:09:16<\/td><td>运行环境、多会话、上下文迁移、现场协助与人工判断<\/td><\/tr><\/tbody><\/table><\/div><p>依据此前取得并核对的五份完整转写，未逐段回听音频。以上为转写定位；AJ和匿名Speaker 1的内容不归为彬哥原话。内部来源链接可从<a href=\"https://waytoagi.feishu.cn/docx/Df4zddHyzogCj7xgW52cpmxQncc\" target=\"_blank\" rel=\"noopener noreferrer\">五次周会纪要汇总<\/a>继续查找；该文档仍为纪要版。<\/p><h2>版本与功能边界<\/h2><p>本课于2026-11-19编排。产品比较沿用上一轮核对的官方资料，未进行三产品同题性能实测，也未在当前龙喵界面逐项验证按钮、文件限制和套餐能力。功能用途有材料依据，具体可用性以实际账号、权限与当前版本为准。<\/p><p>文章里的6人团队、知识条数和凌晨整理时刻是当时案例，不作为当前人员口径或产品默认设置。教学要求与判断方法属于本课整理，不冒充原话。2026-11-19庄庄明确：模数日常运行通常无需另外使用豆包工作和WorkBuddy；本版已据此调整定位、示例与自测。<\/p><h2>学习记录与使用<\/h2><p>自包含HTML，无外部脚本、字体或追踪。笔记、进度和答案只尝试保存在当前浏览器，受限时回退内存。隔离预览可能限制复制、下载与持久保存，可下载HTML后用浏览器打开，及时导出笔记。没有统一成绩库或自动收卷。<\/p><p>10题每题10分，80分仅作为复习参考，不等于平台实操通过。课程尚未进行真实学员计时。<\/p><p class=\"caption\">模数 CHRO · 第四课 v2.0 · 内容深化版 · 2026-11-19<\/p><\/article>", "materials": {"context": "工作上下文卡\n工作名称：\n目标与交付物：\n负责人和截止时间：\n材料链接及读取情况：\n已确认决定与理由：\n采用版本及链接：\n待确认事项：\n下一步及负责人：\n只填当前工作需要的信息，未知项明确写待确认。", "handover": "请整理这件工作的交接摘要：目标、现状、关键材料、已确认决定和理由、采用版本、未解决的问题、下一步。每个重要结论附来源链接。已完成和待处理分开写，缺失信息标待确认。请保存在这件工作中，先不替我通知其他同事。", "accept": "成果验收卡\n1. 文件或链接能打开、能按需要编辑。\n2. 人名、数字、日期及关键结论有来源。\n3. 达到本次交付标准，待确认项清楚。\n4. 采用的版本明确，确认人和理由可追溯。\n5. 工作状态、材料、下一步同步更新。\n6. 生成、发送、对方确认、业务完成分别核对。", "start": "请根据我提供的活动方案和会议纪要，整理一份内部筹备清单。\n先确认两份材料是否读取成功，再列出事项、负责人、截止时间、交付物和待确认问题。\n只用材料里已确认的信息，没有说清的标待确认。请附关键结论的来源，交付可编辑表格，供我审核；本次先不发通知。"}, "framework_md": "# 第四课｜认识龙喵：原理与基本功能\n\n原编号03 · 深入阅读约55–70分钟，不含自测\n\n1. 龙喵与团队工作：理解龙喵怎样完成任务并承接团队上下文；产品对比仅帮助理解定位。\n2. 原理与上下文：分清模型、工具、Skill，以及工作、会话和成果。\n3. 开始一件工作：找到正确工作，提供必要材料，确认读取和交付标准。\n4. 推进与协作：掌握反馈、主子会话、分支、并行和交接的基本用途。\n5. 验收与采用：区分已接收、已完成、已采用，让交付有可核验的结果。\n6. 复用与自动化：分清资料、知识与Skill，知道哪些工作适合定时执行。"};</script><script>(()=>{
'use strict';
const {lessons:LESSONS,quiz:QUIZ,home:HOME,framework:FRAMEWORK,sources:SOURCES,materials:MATERIALS}=DATA;
const KEY='moshu-ai-office-03-v1';
const blank=()=>({done:[],notes:{},checks:[],answers:{},last:1});
let state=blank(),persistent=true,toastTimer;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&typeof raw==='object'){
state.done=Array.isArray(raw.done)?[...new Set(raw.done.filter(n=>Number.isInteger(n)&&n>=1&&n<=6))]:[];
state.notes=raw.notes&&typeof raw.notes==='object'&&!Array.isArray(raw.notes)?Object.fromEntries(Object.entries(raw.notes).filter(([k,v])=>typeof v==='string')):{};
state.checks=Array.isArray(raw.checks)?raw.checks.filter(n=>Number.isInteger(n)&&n>=0&&n<=3):[];
if(raw.answers&&typeof raw.answers==='object')Object.entries(raw.answers).forEach(([k,v])=>{if(/^\d+$/.test(k)&&+k<QUIZ.length&&Number.isInteger(v)&&v>=0&&v<QUIZ[+k].opts.length)state.answers[k]=v;});
state.last=Number.isInteger(raw.last)&&raw.last>=1&&raw.last<=6?raw.last:1;}
localStorage.setItem(KEY,JSON.stringify(state));}catch(e){persistent=false;}
const main=document.querySelector('main');
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){persistent=false;}document.querySelector('#storageNotice').classList.toggle('hidden',persistent);}
function toast(s){const el=document.querySelector('#toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),4000);}
function progress(){document.querySelector('#progress').value=state.done.length;document.querySelector('#progressLabel').textContent=`已学习 ${state.done.length} / 6 个单元`;document.querySelectorAll('[data-done]').forEach(el=>el.textContent=state.done.includes(+el.dataset.done)?'✓':'');}
function footer(){return '<footer><span>模数 OPC · AI办公能力课程</span><span>HTML v1.0 / 第四课沿用原编号03</span></footer>';}
function route(requested){
clearTimeout(toastTimer);document.querySelector('#toast').classList.add('hidden');
let id=typeof requested==='string'?requested:(location.hash.slice(1)||'home');if(id==='main'){main.focus();return;}
if(!/^(framework|home|sources|assessment|lesson[1-6])$/.test(id))id='framework';
document.body.classList.toggle('exam-mode',id==='assessment');document.querySelector('.layout').classList.remove('menu-open');document.querySelector('#menu').setAttribute('aria-expanded','false');
document.querySelectorAll('[data-nav]').forEach(el=>{const active=el.dataset.nav===id;el.classList.toggle('active',active);if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});
if(id==='framework')main.innerHTML=FRAMEWORK+footer();
else if(id==='home'){main.innerHTML=HOME+footer();if(state.done.length||Object.keys(state.notes).length){const a=document.querySelector('#start');a.href='#lesson'+state.last;a.textContent='继续上次学习 →';}}
else if(id==='sources')main.innerHTML=SOURCES+footer();
else if(id==='assessment'){main.innerHTML=exam()+footer();bindExam();}
else{const i=+id.slice(6),l=LESSONS[i-1];state.last=i;save();main.innerHTML=`<article class="lesson"><div class="crumb"><a href="#home">认识龙喵</a> / ${String(i).padStart(2,'0')} / ${l.time}</div><div class="eyebrow">Unit ${String(i).padStart(2,'0')} of 06</div><h1>${l.title}</h1><p class="intro">${l.desc}</p>${l.body}<div class="bottom"><label class="complete"><input type="checkbox" id="complete" ${state.done.includes(i)?'checked':''}>已学完本单元（非验收成绩）</label><div class="row"><a class="btn secondary small" href="${i===1?'#home':'#lesson'+(i-1)}">← 上一页</a><a class="btn small" href="${i===6?'#assessment':'#lesson'+(i+1)}">${i===6?'独立自测 →':'下一单元 →'}</a></div></div></article>`+footer();
document.querySelector('#complete').onchange=e=>{state.done=state.done.filter(n=>n!==i);if(e.target.checked)state.done.push(i);save();progress();};}
main.querySelectorAll('[data-note]').forEach(el=>{el.value=state.notes[el.dataset.note]||'';el.oninput=()=>{state.notes[el.dataset.note]=el.value;save();};});
main.querySelectorAll('[data-check]').forEach(el=>{el.checked=state.checks.includes(+el.dataset.check);el.onchange=()=>{state.checks=state.checks.filter(n=>n!==+el.dataset.check);if(el.checked)state.checks.push(+el.dataset.check);save();};});

main.dataset.route=id;progress();document.querySelector('#storageNotice').classList.toggle('hidden',persistent);window.scrollTo({top:0,left:0,behavior:'instant'});main.focus({preventScroll:true});
}
async function copy(text,button){try{await Promise.race([navigator.clipboard.writeText(text),new Promise((_,reject)=>setTimeout(()=>reject(Error('clipboard timeout')),1200))]);}catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.top='0';document.body.append(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();if(!ok){const node=document.getElementById(button.dataset.copy),range=document.createRange();range.selectNodeContents(node);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);toast('已选中原文，请手动复制。');return;}}
toast('已复制。请核对内容后粘贴到你的AI工具。');}
function download(name,text,type='text/plain;charset=utf-8'){try{const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('已请求下载；若预览阻止下载，请用浏览器打开HTML后操作。');}catch(e){toast('当前预览不支持下载，请下载HTML后在浏览器打开。');}}
const noteLabels={"note1": "龙喵与团队工作", "note2": "原理与上下文", "note3": "开始一件工作", "note4": "推进与协作", "note5": "验收与采用", "note6": "复用与自动化"};
function exportNotes(){download('认识龙喵_我的学习笔记.md','# 认识龙喵｜我的学习笔记\n\n导出时间：'+new Date().toLocaleString('zh-CN')+'\n本机学习记录，未提交，非能力通过凭据。\n已标记学习：'+state.done.length+'/6个单元。\n\n'+Object.entries(noteLabels).map(([k,t])=>'## '+t+'\n\n'+(state.notes[k]||'（未填写）')).join('\n\n'));}
function exam(){return `<article class="lesson exam"><div class="crumb"><a href="#home">← 返回第四课</a> / 独立知识自测</div><div class="eyebrow">Check your understanding</div><h1>懂方法，也会判断。</h1><p class="intro">10道情境题，每题10分，约8分钟。80分为知识自测参考线，允许回看课程；本课不替代第五课的案例实操。</p><p class="caption">本机自测 · 不上传 · 不生成厂商认证 · 页面包含解析，不作为保密正式考卷</p><form id="quizForm">${QUIZ.map((q,i)=>`<section class="question" id="q${i}"><h3 id="qtitle${i}">${String(i+1).padStart(2,'0')} / ${q.q}</h3><fieldset aria-labelledby="qtitle${i}" style="border:0;padding:0;margin:0"><legend class="caption">单选 · 10分</legend>${q.opts.map((t,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${state.answers[i]===j?'checked':''}><span>${t}</span></label>`).join('')}</fieldset><div class="review" id="review${i}"></div></section>`).join('')}<p id="examAlert" role="alert"></p><div class="row"><button type="submit" class="btn">查看自测结果 →</button><button type="button" id="retry" class="btn secondary">重新作答</button></div></form><div id="result" tabindex="-1" aria-live="polite"></div><div class="notice">本卷用于理解诊断。第五课再通过完整案例检验实际操作能力。</div></article>`;}
function resultData(){const dims={};let score=0;const wrong=[];QUIZ.forEach((q,i)=>{if(!dims[q.dim])dims[q.dim]={correct:0,total:0};dims[q.dim].total++;if(state.answers[i]===q.a){score+=10;dims[q.dim].correct++;}else wrong.push(i+1);});return {score,dims,wrong};}
function bindExam(){document.querySelectorAll('#quizForm input').forEach(el=>el.onchange=()=>{state.answers[+el.name.slice(1)]=+el.value;save();document.querySelector('#result').innerHTML='';document.querySelectorAll('.review').forEach(r=>r.innerHTML='');document.querySelector('#examAlert').textContent='';});
document.querySelector('#quizForm').onsubmit=e=>{e.preventDefault();const missing=QUIZ.map((q,i)=>i).filter(i=>state.answers[i]===undefined);if(missing.length){document.querySelector('#examAlert').textContent='还有 '+missing.length+' 题未作答，请先完成。';document.querySelector(`[name="q${missing[0]}"]`).focus();return;}
const {score,dims,wrong}=resultData();QUIZ.forEach((q,i)=>{document.querySelector('#review'+i).innerHTML=`<div class="feedback"><b>${state.answers[i]===q.a?'回答正确':'需要再看一看'}</b> · 正确选项：${q.opts[q.a]}<p>${q.why}</p><a href="#lesson${q.lesson}">回到第${q.lesson}单元复习 →</a></div>`;});
document.querySelector('#result').innerHTML=`<div class="result"><span class="label">本次知识自测</span><strong>${score}</strong> / 100<p>${score>=80?'已达到自测参考线。可回顾本课笔记，为第五课案例实操做准备。':'建议回看错题对应单元，再重做一次。'}</p><div class="flow">${Object.entries(dims).map(([k,v])=>`<div><b>${k}</b>${v.correct} / ${v.total}题正确</div>`).join('')}</div><p class="smalltext">分项题数有限，仅用于定位知识点，不能直接作为能力评级。</p><div class="row"><button type="button" class="btn secondary small" id="exportScore">导出本次结果</button><a href="#lesson6">复习本课要点 →</a></div><p class="caption">成绩未上传；学习完成和实操通过分别判断。</p></div>`;
document.querySelector('#exportScore').onclick=()=>download('认识龙喵_知识自测.json',JSON.stringify({course:'认识龙喵',version:'1.0',at:new Date().toISOString(),score,dims,wrongQuestions:wrong,answers:state.answers,status:'本机知识自测；未提交；非实操认证'},null,2),'application/json;charset=utf-8');document.querySelector('#result').focus();};
document.querySelector('#retry').onclick=()=>{state.answers={};save();route('assessment');toast('已清空答案，可以重新作答。');};}
document.addEventListener('click',e=>{const link=e.target.closest('a[href^="#"]');if(link){e.preventDefault();const hash=link.getAttribute('href');try{history.pushState(null,'',hash);}catch(err){}route(hash.slice(1));return;}const copyBtn=e.target.closest('[data-copy]');if(copyBtn){const node=document.getElementById(copyBtn.dataset.copy);if(node)copy(node.innerText,copyBtn);}const d=e.target.closest('[data-download]');if(d){const key=d.dataset.download;download(key==='framework'?'AI办公能力_课程框架.md':'认识龙喵_'+key+'.txt',key==='framework'?DATA.framework_md:MATERIALS[key]);}if(e.target.closest('[data-export="notes"]'))exportNotes();});
document.querySelector('#menu').onclick=()=>{const open=document.querySelector('.layout').classList.toggle('menu-open');document.querySelector('#menu').setAttribute('aria-expanded',String(open));};
document.querySelector('#reset').onclick=()=>{if(confirm('清除本浏览器中本课的进度、笔记与自测草稿？建议先导出。')){const active=main.dataset.route;state=blank();save();route(active);toast('已清除本课本机记录。');}};
window.addEventListener('hashchange',route);window.addEventListener('popstate',route);route();
})();
</script></body></html>
